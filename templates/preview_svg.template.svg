<svg class="svgflow" data-svgflow-id="{{ID}}" width="100%" viewBox="0 0 680 {{H}}" xmlns="http://www.w3.org/2000/svg" role="img" xml:lang="{{LOCALE}}" lang="{{LOCALE}}" dir="{{DIR}}">
  <title>{{TITLE}}</title>
  <desc>{{DESC}}</desc>
  <defs>
    <marker id="svgflow-{{ID}}-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .svgflow {
      --text-tertiary: #667085;
      --arr: #667085;
      --gray-fill: #f3f4f6;
      --gray-stroke: #9ca3af;
      --gray-text: #374151;
      --blue-fill: #eff6ff;
      --blue-stroke: #60a5fa;
      --blue-text: #1e3a8a;
      --green-fill: #ecfdf5;
      --green-stroke: #34d399;
      --green-text: #065f46;
      --amber-fill: #fffbeb;
      --amber-stroke: #f59e0b;
      --amber-text: #78350f;
      --coral-fill: #fff1f2;
      --coral-stroke: #fb7185;
      --coral-text: #9f1239;
      --purple-fill: #f5f3ff;
      --purple-stroke: #a78bfa;
      --purple-text: #4c1d95;
      --teal-fill: #f0fdfa;
      --teal-stroke: #2dd4bf;
      --teal-text: #134e4a;
    }

    @media (prefers-color-scheme: dark) {
      .svgflow {
        --text-tertiary: #9ca3af;
        --arr: #94a3b8;
        --gray-fill: #374151;
        --gray-stroke: #9ca3af;
        --gray-text: #f9fafb;
        --blue-fill: #1e3a8a;
        --blue-stroke: #93c5fd;
        --blue-text: #eff6ff;
        --green-fill: #064e3b;
        --green-stroke: #6ee7b7;
        --green-text: #ecfdf5;
        --amber-fill: #78350f;
        --amber-stroke: #fbbf24;
        --amber-text: #fffbeb;
        --coral-fill: #881337;
        --coral-stroke: #fda4af;
        --coral-text: #fff1f2;
        --purple-fill: #4c1d95;
        --purple-stroke: #c4b5fd;
        --purple-text: #f5f3ff;
        --teal-fill: #134e4a;
        --teal-stroke: #5eead4;
        --teal-text: #f0fdfa;
      }
    }

    .th {
      font-size: 14px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans CJK SC", "Noto Sans Arabic", "Noto Sans Hebrew", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .t {
      font-size: 14px;
      font-weight: 400;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans CJK SC", "Noto Sans Arabic", "Noto Sans Hebrew", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .ts {
      font-size: 12px;
      font-weight: 400;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans CJK SC", "Noto Sans Arabic", "Noto Sans Hebrew", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .arr {
      stroke: var(--arr);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .label {
      fill: var(--text-tertiary);
    }

    .node > rect,
    .node > polygon {
      stroke-width: 0.5;
    }

    .c-gray > rect, .c-gray > polygon { fill: var(--gray-fill); stroke: var(--gray-stroke); }
    .c-gray > text { fill: var(--gray-text); }
    .c-blue > rect, .c-blue > polygon { fill: var(--blue-fill); stroke: var(--blue-stroke); }
    .c-blue > text { fill: var(--blue-text); }
    .c-green > rect, .c-green > polygon { fill: var(--green-fill); stroke: var(--green-stroke); }
    .c-green > text { fill: var(--green-text); }
    .c-amber > rect, .c-amber > polygon { fill: var(--amber-fill); stroke: var(--amber-stroke); }
    .c-amber > text { fill: var(--amber-text); }
    .c-coral > rect, .c-coral > polygon { fill: var(--coral-fill); stroke: var(--coral-stroke); }
    .c-coral > text { fill: var(--coral-text); }
    .c-purple > rect, .c-purple > polygon { fill: var(--purple-fill); stroke: var(--purple-stroke); }
    .c-purple > text { fill: var(--purple-text); }
    .c-teal > rect, .c-teal > polygon { fill: var(--teal-fill); stroke: var(--teal-stroke); }
    .c-teal > text { fill: var(--teal-text); }
  </style>

  {{CONNECTORS}}
  {{NODES}}
  {{LABELS}}
</svg>
