<!doctype html>
<html lang="{{LOCALE}}" dir="{{DIR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: #f6f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans CJK SC", "Noto Sans Arabic", "Noto Sans Hebrew", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .wrap {
      width: min(100%, 760px);
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      overflow: auto;
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>{{TITLE}}</h1>
    <section class="card">
      {{SVG}}
    </section>
  </main>
</body>
</html>
