<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Platform Overview Infographic</title>
<desc>A universal infographic rendering with grouped nodes, labeled edges, a feedback loop, a legend, and clickable interactions.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<mask id="infographic-text-gaps" maskUnits="userSpaceOnUse">
<rect x="0" y="0" width="680" height="520" fill="white"/>
<rect x="292" y="137" width="96" height="24" fill="black" rx="3"/>
<rect x="285" y="272" width="110" height="24" fill="black" rx="3"/>
</mask>
</defs>
<rect x="40" y="90" width="600" height="250" rx="12" fill="none" stroke="rgb(133, 183, 235)" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="56" y="114" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Retrieval layer</text>
<g role="button" tabindex="0" aria-label="Explain the orchestration responsibilities in this platform." onclick="sendPrompt('Explain the orchestration responsibilities in this platform.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain the orchestration responsibilities in this platform.')}">
<rect x="220" y="30" width="240" height="56" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14" font-weight="500">Orchestrator</text>
<text x="340" y="72" text-anchor="middle" dominant-baseline="central" fill="rgb(175, 169, 236)" font-size="12">Plan and route work</text>
</g>
<g>
<rect x="60" y="190" width="150" height="68" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/>
<text x="135" y="216" text-anchor="middle" dominant-baseline="central" fill="rgb(211, 209, 199)" font-size="14" font-weight="500">User question</text>
<text x="135" y="236" text-anchor="middle" dominant-baseline="central" fill="rgb(180, 178, 169)" font-size="12">Request</text>
</g>
<g role="button" tabindex="0" aria-label="Compare the knowledge sources used by this platform." onclick="sendPrompt('Compare the knowledge sources used by this platform.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Compare the knowledge sources used by this platform.')}">
<rect x="265" y="190" width="150" height="68" rx="8" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/>
<text x="340" y="216" text-anchor="middle" dominant-baseline="central" fill="rgb(181, 212, 244)" font-size="14" font-weight="500">Knowledge sources</text>
<text x="340" y="236" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">Docs, data, web, tools</text>
</g>
<g>
<rect x="470" y="190" width="150" height="68" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/>
<text x="545" y="216" text-anchor="middle" dominant-baseline="central" fill="rgb(250, 199, 117)" font-size="14" font-weight="500">Synthesizer</text>
<text x="545" y="236" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">Rank, reconcile, cite</text>
</g>
<g>
<rect x="220" y="380" width="240" height="56" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/>
<text x="340" y="402" text-anchor="middle" dominant-baseline="central" fill="rgb(211, 209, 199)" font-size="14" font-weight="500">Grounded answer</text>
<text x="340" y="422" text-anchor="middle" dominant-baseline="central" fill="rgb(180, 178, 169)" font-size="12">Citations and confidence</text>
</g>
<path d="M210 224 L263 224" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#infographic-text-gaps)"/>
<path d="M340 86 L340 188" fill="none" stroke="rgb(83, 74, 183)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" mask="url(#infographic-text-gaps)"/>
<path d="M415 224 L468 224" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#infographic-text-gaps)"/>
<path d="M545 258 L545 306 L340 306 L340 378" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M545 190 Q630 120 460 58" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)" opacity="0.6"/>
<rect x="286" y="138" width="108" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/>
<text x="340" y="152" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Fan out</text>
<rect x="282" y="273" width="116" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/>
<text x="340" y="287" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Grounded result</text>
<g>
<rect x="140" y="468" width="12" height="12" rx="2" fill="rgb(175, 169, 236)"/>
<text x="158" y="478" fill="rgb(194, 192, 182)" font-size="12">Control</text>
<rect x="260" y="468" width="12" height="12" rx="2" fill="rgb(133, 183, 235)"/>
<text x="278" y="478" fill="rgb(194, 192, 182)" font-size="12">Evidence</text>
<rect x="386" y="468" width="12" height="12" rx="2" fill="rgb(180, 178, 169)"/>
<text x="404" y="478" fill="rgb(194, 192, 182)" font-size="12">Output</text>
</g>
</svg>
