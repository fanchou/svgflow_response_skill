<svg class="svgflow" data-svgflow-id="search-flow" width="100%" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img" xml:lang="en-US" lang="en-US" dir="ltr">
  <title>Search Submit Flow</title>
  <desc>Main frontend, backend, and rendering flow after a user submits a search term</desc>
  <defs>
    <marker id="svgflow-search-flow-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .svgflow {
      --text-tertiary: #667085;
      --arr: #667085;
      --gray-fill: #f3f4f6;
      --gray-stroke: #9ca3af;
      --gray-text: #374151;
      --blue-fill: #eff6ff;
      --blue-stroke: #60a5fa;
      --blue-text: #1e3a8a;
      --amber-fill: #fffbeb;
      --amber-stroke: #f59e0b;
      --amber-text: #78350f;
    }

    @media (prefers-color-scheme: dark) {
      .svgflow {
        --text-tertiary: #9ca3af;
        --arr: #94a3b8;
        --gray-fill: #374151;
        --gray-stroke: #9ca3af;
        --gray-text: #f9fafb;
        --blue-fill: #1e3a8a;
        --blue-stroke: #93c5fd;
        --blue-text: #eff6ff;
        --amber-fill: #78350f;
        --amber-stroke: #fbbf24;
        --amber-text: #fffbeb;
      }
    }

    .th {
      font-size: 14px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .ts {
      font-size: 12px;
      font-weight: 400;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .arr {
      stroke: var(--arr);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .label {
      fill: var(--text-tertiary);
    }

    .node > rect,
    .node > polygon {
      stroke-width: 0.5;
    }

    .c-gray > rect, .c-gray > polygon { fill: var(--gray-fill); stroke: var(--gray-stroke); }
    .c-gray > text { fill: var(--gray-text); }
    .c-blue > rect, .c-blue > polygon { fill: var(--blue-fill); stroke: var(--blue-stroke); }
    .c-blue > text { fill: var(--blue-text); }
    .c-amber > rect, .c-amber > polygon { fill: var(--amber-fill); stroke: var(--amber-stroke); }
    .c-amber > text { fill: var(--amber-text); }
  </style>

  <line x1="340" y1="84" x2="340" y2="114" class="arr" marker-end="url(#svgflow-search-flow-arrow)"/>
  <line x1="340" y1="172" x2="340" y2="202" class="arr" marker-end="url(#svgflow-search-flow-arrow)"/>
  <line x1="340" y1="260" x2="340" y2="290" class="arr" marker-end="url(#svgflow-search-flow-arrow)"/>
  <line x1="340" y1="376" x2="340" y2="406" class="arr" marker-end="url(#svgflow-search-flow-arrow)"/>
  <line x1="230" y1="334" x2="170" y2="334" class="arr" marker-end="url(#svgflow-search-flow-arrow)"/>
  <path d="M 40 334 L 40 144 L 188 144" fill="none" class="arr" marker-end="url(#svgflow-search-flow-arrow)"/>
  <line x1="340" y1="464" x2="340" y2="494" class="arr" marker-end="url(#svgflow-search-flow-arrow)"/>
  <line x1="340" y1="552" x2="340" y2="582" class="arr" marker-end="url(#svgflow-search-flow-arrow)"/>

  <g class="node c-gray">
    <rect x="255" y="40" width="170" height="44" rx="22"/>
    <text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Start</text>
  </g>

  <g class="node c-blue">
    <rect x="190" y="116" width="300" height="56" rx="8"/>
    <text class="th" x="340" y="136" text-anchor="middle" dominant-baseline="central">Enter keyword</text>
    <text class="ts" x="340" y="156" text-anchor="middle" dominant-baseline="central">Submit</text>
  </g>

  <g class="node c-blue">
    <rect x="190" y="204" width="300" height="56" rx="8"/>
    <text class="th" x="340" y="224" text-anchor="middle" dominant-baseline="central">Capture event</text>
    <text class="ts" x="340" y="244" text-anchor="middle" dominant-baseline="central">Read input</text>
  </g>

  <g class="node c-amber">
    <polygon points="340,292 450,334 340,376 230,334"/>
    <text class="th" x="340" y="334" text-anchor="middle" dominant-baseline="central">Valid?</text>
  </g>

  <g class="node c-amber">
    <rect x="40" y="306" width="160" height="56" rx="8"/>
    <text class="th" x="120" y="326" text-anchor="middle" dominant-baseline="central">Show prompt</text>
    <text class="ts" x="120" y="346" text-anchor="middle" dominant-baseline="central">Empty input</text>
  </g>

  <g class="node c-blue">
    <rect x="190" y="408" width="300" height="56" rx="8"/>
    <text class="th" x="340" y="428" text-anchor="middle" dominant-baseline="central">Build request</text>
    <text class="ts" x="340" y="448" text-anchor="middle" dominant-baseline="central">URL and params</text>
  </g>

  <g class="node c-blue">
    <rect x="190" y="496" width="300" height="56" rx="8"/>
    <text class="th" x="340" y="516" text-anchor="middle" dominant-baseline="central">Search and rank</text>
    <text class="ts" x="340" y="536" text-anchor="middle" dominant-baseline="central">Rank results</text>
  </g>

  <g class="node c-gray">
    <rect x="220" y="584" width="240" height="44" rx="22"/>
    <text class="th" x="340" y="606" text-anchor="middle" dominant-baseline="central">Render results</text>
  </g>

  <text class="ts label" x="354" y="394">Yes</text>
  <text class="ts label" x="198" y="326" text-anchor="middle">No</text>
  <text class="ts label" x="54" y="242">Back</text>
</svg>
