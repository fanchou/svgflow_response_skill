<svg class="svgflow" data-svgflow-id="simple-lr-flow" width="100%" viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg" role="img" xml:lang="en-US" lang="en-US" dir="ltr">
  <title>Short LR Flow</title>
  <desc>Use left-to-right layout when the flow is short and has no complex branches</desc>
  <defs>
    <marker id="svgflow-simple-lr-flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .svgflow { --arr: #667085; --gray-fill: #f3f4f6; --gray-stroke: #9ca3af; --gray-text: #374151; --blue-fill: #eff6ff; --blue-stroke: #60a5fa; --blue-text: #1e3a8a; --green-fill: #ecfdf5; --green-stroke: #34d399; --green-text: #065f46; }
    .th { font-size: 14px; font-weight: 500; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .arr { stroke: var(--arr); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .node > rect { stroke-width: 0.5; }
    .c-gray > rect { fill: var(--gray-fill); stroke: var(--gray-stroke); }
    .c-gray > text { fill: var(--gray-text); }
    .c-blue > rect { fill: var(--blue-fill); stroke: var(--blue-stroke); }
    .c-blue > text { fill: var(--blue-text); }
    .c-green > rect { fill: var(--green-fill); stroke: var(--green-stroke); }
    .c-green > text { fill: var(--green-text); }
  </style>
  <line x1="180" y1="90" x2="220" y2="90" class="arr" marker-end="url(#svgflow-simple-lr-flow-arrow)"/>
  <line x1="340" y1="90" x2="380" y2="90" class="arr" marker-end="url(#svgflow-simple-lr-flow-arrow)"/>
  <line x1="500" y1="90" x2="540" y2="90" class="arr" marker-end="url(#svgflow-simple-lr-flow-arrow)"/>
  <g class="node c-gray">
    <rect x="40" y="68" width="140" height="44" rx="22"/>
    <text class="th" x="110" y="90" text-anchor="middle" dominant-baseline="central">Start</text>
  </g>
  <g class="node c-blue">
    <rect x="220" y="68" width="120" height="44" rx="8"/>
    <text class="th" x="280" y="90" text-anchor="middle" dominant-baseline="central">Submit form</text>
  </g>
  <g class="node c-blue">
    <rect x="380" y="68" width="120" height="44" rx="8"/>
    <text class="th" x="440" y="90" text-anchor="middle" dominant-baseline="central">Save data</text>
  </g>
  <g class="node c-green">
    <rect x="540" y="68" width="100" height="44" rx="22"/>
    <text class="th" x="590" y="90" text-anchor="middle" dominant-baseline="central">Submit done</text>
  </g>
</svg>
