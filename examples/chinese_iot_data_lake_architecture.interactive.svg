<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>IoT 数据湖分层架构</title>
<desc>从设备接入到消费层的五层结构：接入层、流处理层、存储层、服务层、消费层</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g>
<rect x="40" y="30" width="600" height="72" rx="12" stroke-width="0.5" style="fill:#712B13;stroke:#F0997B"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" style="fill:#F5C4B3;font-size:14px;font-weight:500">接入层</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">MQTT · Kafka · HTTP · CoAP · OPC-UA</text>
</g>
<g onclick="sendPrompt('IoT 数据接入层如何做协议适配和背压控制？')"><rect x="60" y="88" width="150" height="30" rx="6" stroke-width="0.5" style="fill:#712B13;stroke:#F0997B"/><text x="135" y="107" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">消息队列缓冲</text></g>
<g onclick="sendPrompt('IoT 接入层如何做设备认证和连接管理？')"><rect x="230" y="88" width="150" height="30" rx="6" stroke-width="0.5" style="fill:#712B13;stroke:#F0997B"/><text x="305" y="107" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">设备连接管理</text></g>
<g onclick="sendPrompt('IoT 数据接入时如何做格式标准化和 Schema 注册？')"><rect x="400" y="88" width="150" height="30" rx="6" stroke-width="0.5" style="fill:#712B13;stroke:#F0997B"/><text x="475" y="107" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">Schema 注册</text></g>
<line x1="340" y1="118" x2="340" y2="143" stroke="#9C9A92" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="145" width="600" height="72" rx="12" stroke-width="0.5" style="fill:#633806;stroke:#EF9F27"/>
<text x="340" y="173" text-anchor="middle" dominant-baseline="central" style="fill:#FAC775;font-size:14px;font-weight:500">流处理层</text>
<text x="340" y="193" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;font-size:12px">实时计算 · 异常检测 · 数据清洗 · 特征提取</text>
</g>
<g onclick="sendPrompt('IoT 流处理中窗口聚合和 CEP 复杂事件处理如何实现？')"><rect x="60" y="203" width="150" height="30" rx="6" stroke-width="0.5" style="fill:#633806;stroke:#EF9F27"/><text x="135" y="222" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;font-size:12px">窗口聚合 / CEP</text></g>
<g onclick="sendPrompt('IoT 流数据的实时质量校验和异常过滤策略？')"><rect x="230" y="203" width="150" height="30" rx="6" stroke-width="0.5" style="fill:#633806;stroke:#EF9F27"/><text x="305" y="222" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;font-size:12px">质量校验 / 过滤</text></g>
<g onclick="sendPrompt('IoT 实时流中如何做数据去重和迟到数据处理？')"><rect x="400" y="203" width="150" height="30" rx="6" stroke-width="0.5" style="fill:#633806;stroke:#EF9F27"/><text x="475" y="222" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;font-size:12px">去重 / 迟到处理</text></g>
<line x1="340" y1="233" x2="340" y2="258" stroke="#9C9A92" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="260" width="600" height="200" rx="12" stroke-width="0.5" style="fill:#085041;stroke:#5DCAA5"/>
<text x="340" y="286" text-anchor="middle" dominant-baseline="central" style="fill:#9FE1CB;font-size:14px;font-weight:500">存储层（三区架构）</text>
</g>
<g onclick="sendPrompt('数据湖 Bronze 区原始数据存储格式和生命周期策略？')"><rect x="60" y="300" width="168" height="140" rx="8" stroke-width="0.5" style="fill:#712B13;stroke:#F0997B"/><text x="144" y="325" text-anchor="middle" dominant-baseline="central" style="fill:#F5C4B3;font-size:14px;font-weight:500">Bronze 区</text><text x="144" y="348" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">原始 / 不可变</text><text x="144" y="371" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">Parquet · Avro</text><text x="144" y="394" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">按设备/日期分区</text></g>
<g onclick="sendPrompt('数据湖 Silver 区清洗和标准化的具体处理步骤？')"><rect x="256" y="300" width="168" height="140" rx="8" stroke-width="0.5" style="fill:#633806;stroke:#EF9F27"/><text x="340" y="325" text-anchor="middle" dominant-baseline="central" style="fill:#FAC775;font-size:14px;font-weight:500">Silver 区</text><text x="340" y="348" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;font-size:12px">清洗 / 标准化</text><text x="340" y="371" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;font-size:12px">Delta Lake · Iceberg</text><text x="340" y="394" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;font-size:12px">支持 ACID 事务</text></g>
<g onclick="sendPrompt('数据湖 Gold 区聚合指标如何设计和更新？')"><rect x="452" y="300" width="168" height="140" rx="8" stroke-width="0.5" style="fill:#085041;stroke:#5DCAA5"/><text x="536" y="325" text-anchor="middle" dominant-baseline="central" style="fill:#9FE1CB;font-size:14px;font-weight:500">Gold 区</text><text x="536" y="348" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">聚合 / 业务指标</text><text x="536" y="371" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">物化视图</text><text x="536" y="394" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">低延迟查询</text></g>
<line x1="340" y1="460" x2="340" y2="488" stroke="#9C9A92" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="490" width="600" height="72" rx="12" stroke-width="0.5" style="fill:#3C3489;stroke:#AFA9EC"/>
<text x="340" y="518" text-anchor="middle" dominant-baseline="central" style="fill:#CECBF6;font-size:14px;font-weight:500">服务层</text>
<text x="340" y="538" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC;font-size:12px">统一查询 · 数据目录 · 访问控制 · 血缘追踪</text>
</g>
<g onclick="sendPrompt('IoT 数据湖统一查询引擎如何选型？')"><rect x="60" y="548" width="140" height="30" rx="6" stroke-width="0.5" style="fill:#3C3489;stroke:#AFA9EC"/><text x="130" y="567" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC;font-size:12px">Trino / Spark SQL</text></g>
<g onclick="sendPrompt('IoT 数据湖数据目录和元数据管理如何实现？')"><rect x="220" y="548" width="140" height="30" rx="6" stroke-width="0.5" style="fill:#3C3489;stroke:#AFA9EC"/><text x="290" y="567" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC;font-size:12px">数据目录 / 血缘</text></g>
<g onclick="sendPrompt('IoT 数据湖行列级别的细粒度访问控制设计？')"><rect x="380" y="548" width="140" height="30" rx="6" stroke-width="0.5" style="fill:#3C3489;stroke:#AFA9EC"/><text x="450" y="567" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC;font-size:12px">行列级权限控制</text></g>
<line x1="340" y1="578" x2="340" y2="606" stroke="#9C9A92" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>
<g><rect x="40" y="608" width="600" height="48" rx="12" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="340" y="636" text-anchor="middle" dominant-baseline="central" style="fill:#D3D1C7;font-size:14px;font-weight:500">消费层</text></g>
<g onclick="sendPrompt('IoT 数据湖如何对接 AI/ML 训练平台？')"><rect x="60" y="622" width="100" height="24" rx="5" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="110" y="638" text-anchor="middle" dominant-baseline="central" style="fill:#B4B2A9;font-size:12px">AI / ML</text></g>
<g onclick="sendPrompt('IoT 数据湖 BI 报表接入的最佳实践？')"><rect x="178" y="622" width="100" height="24" rx="5" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="228" y="638" text-anchor="middle" dominant-baseline="central" style="fill:#B4B2A9;font-size:12px">BI 报表</text></g>
<g onclick="sendPrompt('IoT 数字孪生如何消费数据湖数据？')"><rect x="296" y="622" width="100" height="24" rx="5" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="346" y="638" text-anchor="middle" dominant-baseline="central" style="fill:#B4B2A9;font-size:12px">数字孪生</text></g>
<g onclick="sendPrompt('IoT 平台实时监控大屏如何对接数据湖？')"><rect x="414" y="622" width="100" height="24" rx="5" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="464" y="638" text-anchor="middle" dominant-baseline="central" style="fill:#B4B2A9;font-size:12px">实时监控</text></g>
<g onclick="sendPrompt('IoT 数据湖开放 API 设计规范？')"><rect x="532" y="622" width="88" height="24" rx="5" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="576" y="638" text-anchor="middle" dominant-baseline="central" style="fill:#B4B2A9;font-size:12px">开放 API</text></g>
</svg>
