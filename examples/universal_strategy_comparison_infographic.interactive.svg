<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Strategy Comparison Infographic</title>
<desc>A universal comparison infographic with aligned option cards, tradeoff connectors, a risk note, a legend, and a clickable action.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<mask id="comparison-label-gaps" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="460" fill="white"/><rect x="188" y="200" width="94" height="22" fill="black" rx="3"/><rect x="398" y="200" width="96" height="22" fill="black" rx="3"/></mask>
</defs>
<rect x="40" y="64" width="600" height="240" rx="12" fill="none" stroke="rgb(133, 183, 235)" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="56" y="88" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Options</text>
<g><rect x="70" y="116" width="150" height="136" rx="8" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/><text x="145" y="142" text-anchor="middle" dominant-baseline="central" fill="rgb(181, 212, 244)" font-size="14" font-weight="500">Build</text><text x="145" y="164" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">Full control</text><text x="145" y="190" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">High ownership</text><text x="145" y="212" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">Slow start</text></g>
<g><rect x="265" y="116" width="150" height="136" rx="8" fill="rgb(39, 80, 10)" stroke="rgb(151, 196, 89)" stroke-width="0.5"/><text x="340" y="142" text-anchor="middle" dominant-baseline="central" fill="rgb(192, 221, 151)" font-size="14" font-weight="500">Buy</text><text x="340" y="164" text-anchor="middle" dominant-baseline="central" fill="rgb(151, 196, 89)" font-size="12">Fastest path</text><text x="340" y="190" text-anchor="middle" dominant-baseline="central" fill="rgb(151, 196, 89)" font-size="12">Recurring cost</text><text x="340" y="212" text-anchor="middle" dominant-baseline="central" fill="rgb(151, 196, 89)" font-size="12">Vendor risk</text></g>
<g><rect x="460" y="116" width="150" height="136" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/><text x="535" y="142" text-anchor="middle" dominant-baseline="central" fill="rgb(250, 199, 117)" font-size="14" font-weight="500">Partner</text><text x="535" y="164" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">Shared risk</text><text x="535" y="190" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">Flexible scale</text><text x="535" y="212" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">Contract work</text></g>
<g role="button" tabindex="0" aria-label="How should we reduce decision risk before rollout?" onclick="sendPrompt('How should we reduce decision risk before rollout?')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('How should we reduce decision risk before rollout?')}"><rect x="220" y="330" width="240" height="56" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/><text x="340" y="352" text-anchor="middle" dominant-baseline="central" fill="rgb(245, 196, 179)" font-size="14" font-weight="500">Decision risk</text><text x="340" y="372" text-anchor="middle" dominant-baseline="central" fill="rgb(240, 153, 123)" font-size="12">Switching cost rises after rollout</text></g>
<path d="M220 184 L263 184" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#comparison-label-gaps)"/>
<path d="M415 184 L458 184" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#comparison-label-gaps)"/>
<path d="M535 252 L535 292 L340 292 L340 328" fill="none" stroke="rgb(216, 90, 48)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M145 252 L145 292 L340 292" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="188" y="200" width="94" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="235" y="214" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Control vs speed</text>
<rect x="394" y="200" width="104" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="446" y="214" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Flexibility</text>
<rect x="150" y="418" width="12" height="12" rx="2" fill="rgb(151, 196, 89)"/><text x="168" y="428" fill="rgb(194, 192, 182)" font-size="12">Recommended</text>
<rect x="300" y="418" width="12" height="12" rx="2" fill="rgb(239, 159, 39)"/><text x="318" y="428" fill="rgb(194, 192, 182)" font-size="12">Tradeoff</text>
<rect x="420" y="418" width="12" height="12" rx="2" fill="rgb(240, 153, 123)"/><text x="438" y="428" fill="rgb(194, 192, 182)" font-size="12">Risk</text>
</svg>
