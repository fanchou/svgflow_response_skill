<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IoT平台数据湖架构设计</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #141412;
      color: #faf9f5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 0%, rgba(93, 202, 165, 0.12), transparent 34%),
        #141412;
    }

    main {
      width: min(100%, 980px);
    }

    .preview {
      background: #1b1b18;
      border: 1px solid rgba(250, 249, 245, 0.12);
      border-radius: 12px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      padding: 20px;
    }

    object {
      display: block;
      width: 100%;
      min-height: 680px;
      border: 0;
    }

    .hint {
      margin: 12px 4px 0;
      color: #c2c0b6;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="preview">
      <object type="image/svg+xml" data="./iot_data_lake_architecture.svg" aria-label="IoT平台数据湖架构设计"></object>
    </div>
    <p class="hint">数据源、接入缓冲、湖仓分层、计算消费、治理运维是这个架构的主结构。</p>
  </main>
</body>
</html>
