<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Platform Architecture Stack</title>
<desc>A universal layered architecture stack with channels, API, services, data, observability, labels, legend, and clickable inspection.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<mask id="stack-label-gaps" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="620" fill="white"/><rect x="296" y="138" width="88" height="22" fill="black" rx="3"/><rect x="296" y="248" width="88" height="22" fill="black" rx="3"/><rect x="292" y="358" width="96" height="22" fill="black" rx="3"/></mask>
</defs>
<rect x="40" y="42" width="600" height="430" rx="12" fill="none" stroke="rgb(133, 183, 235)" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="56" y="66" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Runtime stack</text>
<g><rect x="120" y="88" width="440" height="62" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/><text x="340" y="112" text-anchor="middle" dominant-baseline="central" fill="rgb(211, 209, 199)" font-size="14" font-weight="500">Channels</text><text x="340" y="132" text-anchor="middle" dominant-baseline="central" fill="rgb(180, 178, 169)" font-size="12">Web, mobile, partners</text></g>
<g role="button" tabindex="0" aria-label="Explain the API layer responsibilities." onclick="sendPrompt('Explain the API layer responsibilities.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain the API layer responsibilities.')}"><rect x="120" y="198" width="440" height="62" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/><text x="340" y="222" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14" font-weight="500">API layer</text><text x="340" y="242" text-anchor="middle" dominant-baseline="central" fill="rgb(175, 169, 236)" font-size="12">Auth, routing, contracts</text></g>
<g><rect x="120" y="308" width="440" height="62" rx="8" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/><text x="340" y="332" text-anchor="middle" dominant-baseline="central" fill="rgb(181, 212, 244)" font-size="14" font-weight="500">Service capabilities</text><text x="340" y="352" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">Orders, billing, support</text></g>
<g><rect x="120" y="418" width="440" height="62" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/><text x="340" y="442" text-anchor="middle" dominant-baseline="central" fill="rgb(159, 225, 203)" font-size="14" font-weight="500">Data layer</text><text x="340" y="462" text-anchor="middle" dominant-baseline="central" fill="rgb(93, 202, 165)" font-size="12">Operational and analytical stores</text></g>
<g><rect x="470" y="508" width="150" height="54" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/><text x="545" y="528" text-anchor="middle" dominant-baseline="central" fill="rgb(250, 199, 117)" font-size="14" font-weight="500">Observability</text><text x="545" y="546" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">Metrics, traces</text></g>
<path d="M340 150 L340 196" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#stack-label-gaps)"/>
<path d="M340 260 L340 306" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#stack-label-gaps)"/>
<path d="M340 370 L340 416" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#stack-label-gaps)"/>
<path d="M545 508 L545 340 L562 340" fill="none" stroke="rgb(239, 159, 39)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="296" y="138" width="88" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="340" y="152" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Request</text>
<rect x="296" y="248" width="88" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="340" y="262" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Route</text>
<rect x="292" y="358" width="96" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="340" y="372" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Read/write</text>
<rect x="150" y="580" width="12" height="12" rx="2" fill="rgb(133, 183, 235)"/><text x="168" y="590" fill="rgb(194, 192, 182)" font-size="12">Runtime</text>
<rect x="300" y="580" width="12" height="12" rx="2" fill="rgb(93, 202, 165)"/><text x="318" y="590" fill="rgb(194, 192, 182)" font-size="12">Data</text>
<rect x="420" y="580" width="12" height="12" rx="2" fill="rgb(239, 159, 39)"/><text x="438" y="590" fill="rgb(194, 192, 182)" font-size="12">Ops</text>
</svg>
