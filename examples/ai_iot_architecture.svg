<svg class="svgflow" data-svgflow-id="dark-layered-architecture" width="100%" viewBox="0 0 690 720" xmlns="http://www.w3.org/2000/svg" role="img" xml:lang="zh-CN" lang="zh-CN" dir="ltr">
  <title>AI时代物联网系统架构图</title>
  <desc>展示感知层、边缘层、平台层、应用层四层架构及AI能力分布。</desc>
  <defs>
    <marker id="svgflow-dark-layered-architecture-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c2c0b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .bg{fill:rgb(20,20,18)}.layer-title{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(250,249,245)}.layer-sub{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(194,192,182)}.chip-title{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(250,249,245)}.chip-sub{font:400 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(194,192,182)}.rail{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(194,192,182)}.legend{font:500 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(194,192,182)}.flow{fill:none;stroke:#9c9a92;stroke-width:1.2;opacity:.45}.soft{fill:none;stroke:rgba(222, 220, 209, 0.3);stroke-width:1;stroke-dasharray:4 3}
  </style>
  <rect class="bg" x="0" y="0" width="690" height="720"/>
  <rect x="40" y="30" width="600" height="100" rx="14" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="60" text-anchor="middle" style="fill:rgb(206, 203, 246)">应用层</text>
  <text class="layer-sub" x="340" y="78" text-anchor="middle" style="fill:rgb(175, 169, 236)">AI决策中枢 · 大模型推理 · 业务编排</text>
  <g role="button" tabindex="0" aria-label="LLM 推理引擎" onclick="sendPrompt('AI时代IoT应用层如何集成大语言模型？')" onkeydown="if(event.key==='Enter'||event.key===' ')this.dispatchEvent(new MouseEvent('click'))">
    <rect x="64" y="90" width="130" height="30" rx="6" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
    <text class="chip-title" x="129" y="109" text-anchor="middle">LLM 推理引擎</text>
  </g>
  <g role="button" tabindex="0" aria-label="数字孪生" onclick="sendPrompt('IoT数字孪生技术如何实现？')" onkeydown="if(event.key==='Enter'||event.key===' ')this.dispatchEvent(new MouseEvent('click'))">
    <rect x="210" y="90" width="130" height="30" rx="6" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
    <text class="chip-title" x="275" y="109" text-anchor="middle">数字孪生</text>
  </g>
  <g role="button" tabindex="0" aria-label="自主决策调度" onclick="sendPrompt('请解释自主决策调度在AI时代物联网系统中的设计要点。')" onkeydown="if(event.key==='Enter'||event.key===' ')this.dispatchEvent(new MouseEvent('click'))">
    <rect x="356" y="90" width="130" height="30" rx="6" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
    <text class="chip-title" x="421" y="109" text-anchor="middle">自主决策调度</text>
  </g>
  <g role="button" tabindex="0" aria-label="预测性维护告警" onclick="sendPrompt('请解释预测性维护告警在AI时代物联网系统中的设计要点。')" onkeydown="if(event.key==='Enter'||event.key===' ')this.dispatchEvent(new MouseEvent('click'))">
    <rect x="502" y="90" width="118" height="30" rx="6" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
    <text class="chip-title" x="561" y="109" text-anchor="middle">预测性维护告警</text>
  </g>
