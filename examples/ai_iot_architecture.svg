<svg class="svgflow" data-svgflow-id="dark-layered-architecture" width="100%" viewBox="0 0 690 720" xmlns="http://www.w3.org/2000/svg" role="img" xml:lang="zh-CN" lang="zh-CN" dir="ltr">
  <title>AI时代物联网系统架构图</title>
  <desc>展示感知层、边缘层、平台层、应用层四层架构及AI能力分布。</desc>
  <defs>
    <marker id="svgflow-dark-layered-architecture-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c2c0b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .bg{fill:rgb(20,20,18)}.layer-title{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(250,249,245)}.layer-sub{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(194,192,182)}.chip-title{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(250,249,245)}.chip-sub{font:400 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(194,192,182)}.rail{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(194,192,182)}.legend{font:500 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:rgb(194,192,182)}.flow{fill:none;stroke:#9c9a92;stroke-width:1.2;opacity:.45}.soft{fill:none;stroke:rgba(222, 220, 209, 0.3);stroke-width:1;stroke-dasharray:4 3}
  </style>
  <rect class="bg" x="0" y="0" width="690" height="720"/>
  <rect x="40" y="30" width="600" height="104" rx="14" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="60" text-anchor="middle">应用层</text>
  <text class="layer-sub" x="340" y="80" text-anchor="middle">AI决策中枢 · 大模型推理 · 业务编排</text>
  <g role="button" tabindex="0" aria-label="LLM 推理引擎" onclick="sendPrompt('AI时代IoT应用层如何集成大语言模型？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('AI时代IoT应用层如何集成大语言模型？')}">
    <rect x="61" y="94" width="132" height="28" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
    <text class="chip-title" x="127" y="114" text-anchor="middle">LLM 推理引擎</text>
  </g>
  <g role="button" tabindex="0" aria-label="数字孪生" onclick="sendPrompt('IoT数字孪生技术如何实现？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT数字孪生技术如何实现？')}">
    <rect x="209" y="94" width="124" height="28" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
    <text class="chip-title" x="271" y="114" text-anchor="middle">数字孪生</text>
  </g>
  <rect x="349" y="94" width="132" height="28" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
  <text class="chip-title" x="415" y="114" text-anchor="middle">自主决策调度</text>
  <rect x="497" y="94" width="122" height="28" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
  <text class="chip-title" x="558" y="114" text-anchor="middle">预测性维护告警</text>
  <path class="flow" d="M340 134L340 158" marker-end="url(#svgflow-dark-layered-architecture-arrow)"/>
  <rect x="40" y="160" width="600" height="112" rx="14" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="190" text-anchor="middle">平台层</text>
  <text class="layer-sub" x="340" y="210" text-anchor="middle">云端AI训练 · 数据湖 · 服务编排 · 安全管理</text>
  <rect x="61" y="224" width="132" height="28" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/>
  <text class="chip-title" x="127" y="244" text-anchor="middle">数据湖</text>
  <rect x="209" y="224" width="124" height="28" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/>
  <text class="chip-title" x="271" y="244" text-anchor="middle">模型训练</text>
  <rect x="349" y="224" width="132" height="28" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/>
  <text class="chip-title" x="415" y="244" text-anchor="middle">设备管理</text>
  <rect x="497" y="224" width="122" height="28" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/>
  <text class="chip-title" x="558" y="244" text-anchor="middle">安全中台</text>
  <path class="flow" d="M340 272L340 298" marker-end="url(#svgflow-dark-layered-architecture-arrow)"/>
  <rect x="40" y="300" width="600" height="130" rx="14" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="330" text-anchor="middle">边缘层</text>
  <text class="layer-sub" x="340" y="350" text-anchor="middle">本地AI推理 · 实时响应 · 数据预处理 · 协议转换</text>
  <g role="button" tabindex="0" aria-label="边缘推理节点" onclick="sendPrompt('边缘AI推理引擎如何部署到IoT设备？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('边缘AI推理引擎如何部署到IoT设备？')}">
    <rect x="61" y="366" width="156" height="50" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/>
    <text class="chip-title" x="139" y="386" text-anchor="middle">边缘推理节点</text>
    <text class="chip-sub" x="139" y="404" text-anchor="middle">TinyML · ONNX</text>
  </g>
  <rect x="233" y="366" width="156" height="50" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/>
  <text class="chip-title" x="311" y="386" text-anchor="middle">边缘网关</text>
  <text class="chip-sub" x="311" y="404" text-anchor="middle">协议转换 · 数据融合</text>
  <rect x="405" y="366" width="214" height="50" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/>
  <text class="chip-title" x="512" y="386" text-anchor="middle">离线缓存与弹性计算</text>
  <text class="chip-sub" x="512" y="404" text-anchor="middle">断网续传 · 本地存储</text>
  <path class="flow" d="M340 430L340 458" marker-end="url(#svgflow-dark-layered-architecture-arrow)"/>
  <rect x="40" y="460" width="600" height="130" rx="14" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="490" text-anchor="middle">感知层</text>
  <text class="layer-sub" x="340" y="510" text-anchor="middle">传感器 · 执行器 · 智能终端 · AI芯片端侧推理</text>
  <rect x="61" y="526" width="132" height="50" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/>
  <text class="chip-title" x="127" y="546" text-anchor="middle">多模态传感器</text>
  <text class="chip-sub" x="127" y="564" text-anchor="middle">温/压/视觉/声音</text>
  <rect x="209" y="526" width="124" height="50" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/>
  <text class="chip-title" x="271" y="546" text-anchor="middle">AI 端侧芯片</text>
  <text class="chip-sub" x="271" y="564" text-anchor="middle">NPU · MCU</text>
  <rect x="349" y="526" width="132" height="50" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/>
  <text class="chip-title" x="415" y="546" text-anchor="middle">执行器</text>
  <text class="chip-sub" x="415" y="564" text-anchor="middle">闭环反馈控制</text>
  <g role="button" tabindex="0" aria-label="安全身份标识" onclick="sendPrompt('IoT设备身份认证与安全通信设计')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT设备身份认证与安全通信设计')}">
    <rect x="497" y="526" width="122" height="50" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/>
    <text class="chip-title" x="558" y="546" text-anchor="middle">安全身份标识</text>
    <text class="chip-sub" x="558" y="564" text-anchor="middle">证书 / 密钥管理</text>
  </g>
  <path class="soft" d="M24 460L24 130" stroke="rgba(222, 220, 209, 0.3)" marker-end="url(#svgflow-dark-layered-architecture-arrow)"/>
  <text class="rail" x="22" y="280" text-anchor="middle" transform="rotate(-90 22 280)">数据上行流</text>
  <path class="soft" d="M668 130L668 460" stroke="rgba(222, 220, 209, 0.3)" marker-end="url(#svgflow-dark-layered-architecture-arrow)"/>
  <text class="rail" x="668" y="280" text-anchor="middle" transform="rotate(90 668 280)">AI 决策流</text>
  <rect x="176" y="638" width="12" height="12" rx="2" fill="rgb(60, 52, 137)"/>
  <text class="legend" x="194" y="648">应用与决策</text>
  <rect x="268" y="638" width="12" height="12" rx="2" fill="rgb(8, 80, 65)"/>
  <text class="legend" x="286" y="648">云端平台</text>
  <rect x="360" y="638" width="12" height="12" rx="2" fill="rgb(99, 56, 6)"/>
  <text class="legend" x="378" y="648">边缘执行</text>
  <rect x="452" y="638" width="12" height="12" rx="2" fill="rgb(113, 43, 19)"/>
  <text class="legend" x="470" y="648">端侧感知</text>
  <text class="legend" x="340" y="688" text-anchor="middle">点击各组件了解详细设计</text>
</svg>
