<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图解 HTTP</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef3f8;
      color: #172033;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #eef3f8 0%, #f8fafc 100%);
    }

    main {
      width: min(100%, 980px);
    }

    .preview {
      background: #ffffff;
      border: 1px solid rgba(23, 32, 51, 0.12);
      border-radius: 12px;
      box-shadow: 0 24px 80px rgba(23, 32, 51, 0.16);
      overflow: hidden;
      padding: 18px;
    }

    object {
      display: block;
      width: 100%;
      min-height: 760px;
      border: 0;
    }

    .hint {
      margin: 12px 4px 0;
      color: #64748b;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="preview">
      <object type="image/svg+xml" data="./http_overview.svg" aria-label="图解 HTTP"></object>
    </div>
    <p class="hint">请求报文表达客户端意图，服务器解释后返回响应报文；方法、头部和状态码是阅读 HTTP 的三把钥匙。</p>
  </main>
</body>
</html>
