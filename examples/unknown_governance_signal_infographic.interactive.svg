<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Governance Signal Map</title>
<desc>A universal fallback infographic for mixed review signals that should not be forced into a process flow.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<mask id="governance-label-gaps" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="520" fill="white"/><rect x="303" y="156" width="74" height="22" fill="black" rx="3"/><rect x="303" y="266" width="74" height="22" fill="black" rx="3"/><rect x="454" y="258" width="72" height="22" fill="black" rx="3"/><rect x="156" y="258" width="70" height="22" fill="black" rx="3"/></mask>
</defs>
<rect x="40" y="72" width="600" height="318" rx="12" fill="none" stroke="rgb(133, 183, 235)" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="56" y="96" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Review signals</text>
<g role="button" tabindex="0" aria-label="What guardrails should be in place before scale?" onclick="sendPrompt('What guardrails should be in place before scale?')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('What guardrails should be in place before scale?')}"><rect x="230" y="208" width="220" height="72" rx="10" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/><text x="340" y="234" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14" font-weight="500">Recommendation</text><text x="340" y="256" text-anchor="middle" dominant-baseline="central" fill="rgb(175, 169, 236)" font-size="12">Proceed with guardrails</text></g>
<g><rect x="64" y="128" width="156" height="70" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/><text x="142" y="154" text-anchor="middle" dominant-baseline="central" fill="rgb(245, 196, 179)" font-size="14" font-weight="500">Legal risk</text><text x="142" y="176" text-anchor="middle" dominant-baseline="central" fill="rgb(240, 153, 123)" font-size="12">Rising review load</text></g>
<g><rect x="460" y="128" width="156" height="70" rx="8" fill="rgb(39, 80, 10)" stroke="rgb(151, 196, 89)" stroke-width="0.5"/><text x="538" y="154" text-anchor="middle" dominant-baseline="central" fill="rgb(192, 221, 151)" font-size="14" font-weight="500">Customer trust</text><text x="538" y="176" text-anchor="middle" dominant-baseline="central" fill="rgb(151, 196, 89)" font-size="12">Confidence improving</text></g>
<g><rect x="64" y="306" width="156" height="70" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/><text x="142" y="332" text-anchor="middle" dominant-baseline="central" fill="rgb(250, 199, 117)" font-size="14" font-weight="500">Ops load</text><text x="142" y="354" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">Moderation unstable</text></g>
<g><rect x="460" y="306" width="156" height="70" rx="8" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/><text x="538" y="332" text-anchor="middle" dominant-baseline="central" fill="rgb(181, 212, 244)" font-size="14" font-weight="500">Leadership</text><text x="538" y="354" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">Cautious appetite</text></g>
<g role="button" tabindex="0" aria-label="How should the review guardrail be measured?" onclick="sendPrompt('How should the review guardrail be measured?')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('How should the review guardrail be measured?')}"><rect x="236" y="342" width="208" height="54" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/><text x="340" y="363" text-anchor="middle" dominant-baseline="central" fill="rgb(211, 209, 199)" font-size="14" font-weight="500">Guardrails</text><text x="340" y="382" text-anchor="middle" dominant-baseline="central" fill="rgb(180, 178, 169)" font-size="12">Review before scale</text></g>
<path d="M220 162 L230 226" fill="none" stroke="rgb(216, 90, 48)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#governance-label-gaps)"/>
<path d="M460 162 L450 226" fill="none" stroke="rgb(151, 196, 89)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#governance-label-gaps)"/>
<path d="M220 342 L236 368" fill="none" stroke="rgb(239, 159, 39)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#governance-label-gaps)"/>
<path d="M460 342 L444 368" fill="none" stroke="rgb(133, 183, 235)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#governance-label-gaps)"/>
<path d="M340 342 L340 282" fill="none" stroke="rgb(180, 178, 169)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#governance-label-gaps)"/>
<rect x="303" y="156" width="74" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="340" y="170" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Constrain</text>
<rect x="303" y="266" width="74" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="340" y="280" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Enable</text>
<rect x="454" y="258" width="72" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="490" y="272" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Support</text>
<rect x="156" y="258" width="70" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="191" y="272" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Requires</text>
<rect x="160" y="482" width="12" height="12" rx="2" fill="rgb(151, 196, 89)"/><text x="178" y="492" fill="rgb(194, 192, 182)" font-size="12">Positive</text>
<rect x="290" y="482" width="12" height="12" rx="2" fill="rgb(240, 153, 123)"/><text x="308" y="492" fill="rgb(194, 192, 182)" font-size="12">Risk</text>
<rect x="392" y="482" width="12" height="12" rx="2" fill="rgb(180, 178, 169)"/><text x="410" y="492" fill="rgb(194, 192, 182)" font-size="12">Control</text>
</svg>
