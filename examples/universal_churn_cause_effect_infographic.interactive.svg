<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Churn Cause Effect Map</title>
<desc>Cause-effect infographic connecting churn drivers, activation symptoms, impact, mitigations, and clickable inspection.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<mask id="churn-label-gaps" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="560" fill="white"/><rect x="244" y="146" width="70" height="22" fill="black" rx="3"/><rect x="244" y="250" width="78" height="22" fill="black" rx="3"/><rect x="424" y="210" width="70" height="22" fill="black" rx="3"/><rect x="472" y="320" width="68" height="22" fill="black" rx="3"/></mask>
</defs>
<rect x="38" y="58" width="236" height="350" rx="12" fill="none" stroke="rgb(240, 153, 123)" stroke-width="0.8" stroke-dasharray="5 4"/>
<rect x="380" y="78" width="232" height="250" rx="12" fill="none" stroke="rgb(133, 183, 235)" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="54" y="82" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Contributing causes</text>
<text x="396" y="102" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Observed outcomes</text>
<path d="M244 132 L380 164" fill="none" stroke="rgb(216, 90, 48)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#churn-label-gaps)"/>
<path d="M244 236 L380 196" fill="none" stroke="rgb(239, 159, 39)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#churn-label-gaps)"/>
<path d="M244 340 L508 268" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#churn-label-gaps)"/>
<path d="M492 206 L508 226" fill="none" stroke="rgb(83, 74, 183)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#churn-label-gaps)"/>
<path d="M508 404 L178 374" fill="none" stroke="rgb(29, 158, 117)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)" mask="url(#churn-label-gaps)"/>
<g><rect x="66" y="104" width="178" height="64" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/><text x="155" y="128" text-anchor="middle" dominant-baseline="central" fill="rgb(245, 196, 179)" font-size="14" font-weight="500">Slow onboarding</text><text x="155" y="148" text-anchor="middle" dominant-baseline="central" fill="rgb(240, 153, 123)" font-size="12">Time to value unclear</text></g>
<g><rect x="66" y="208" width="178" height="64" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/><text x="155" y="232" text-anchor="middle" dominant-baseline="central" fill="rgb(250, 199, 117)" font-size="14" font-weight="500">Email gaps</text><text x="155" y="252" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">Activation path uneven</text></g>
<g><rect x="66" y="312" width="178" height="64" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/><text x="155" y="336" text-anchor="middle" dominant-baseline="central" fill="rgb(211, 209, 199)" font-size="14" font-weight="500">Handoff loss</text><text x="155" y="356" text-anchor="middle" dominant-baseline="central" fill="rgb(180, 178, 169)" font-size="12">Support context drops</text></g>
<g><rect x="380" y="140" width="140" height="74" rx="8" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/><text x="450" y="166" text-anchor="middle" dominant-baseline="central" fill="rgb(181, 212, 244)" font-size="14" font-weight="500">Low activation</text><text x="450" y="188" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">Fewer reach value</text></g>
<g><rect x="508" y="226" width="116" height="72" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/><text x="566" y="252" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14" font-weight="500">Churn rise</text><text x="566" y="274" text-anchor="middle" dominant-baseline="central" fill="rgb(175, 169, 236)" font-size="12">Retention falls</text></g>
<g role="button" tabindex="0" aria-label="Explain the churn mitigation plan." onclick="sendPrompt('Explain the churn mitigation plan.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain the churn mitigation plan.')}"><rect x="394" y="380" width="228" height="66" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/><text x="508" y="404" text-anchor="middle" dominant-baseline="central" fill="rgb(159, 225, 203)" font-size="14" font-weight="500">Mitigation plan</text><text x="508" y="426" text-anchor="middle" dominant-baseline="central" fill="rgb(93, 202, 165)" font-size="12">Guide, automate, keep context</text></g>
<rect x="244" y="146" width="70" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="279" y="160" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Delays</text>
<rect x="244" y="250" width="78" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="283" y="264" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Confuses</text>
<rect x="424" y="210" width="70" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="459" y="224" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Predicts</text>
<rect x="472" y="320" width="68" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="506" y="334" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Reduce</text>
<rect x="126" y="506" width="12" height="12" rx="2" fill="rgb(240, 153, 123)"/><text x="144" y="516" fill="rgb(194, 192, 182)" font-size="12">Cause</text>
<rect x="284" y="506" width="12" height="12" rx="2" fill="rgb(133, 183, 235)"/><text x="302" y="516" fill="rgb(194, 192, 182)" font-size="12">Signal</text>
<rect x="444" y="506" width="12" height="12" rx="2" fill="rgb(93, 202, 165)"/><text x="462" y="516" fill="rgb(194, 192, 182)" font-size="12">Action</text>
</svg>
