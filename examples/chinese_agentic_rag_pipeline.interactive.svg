<svg width="100%" viewBox="0 0 690 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>智能体 RAG 架构图</title>
<desc>展示编排智能体如何拆解用户问题、调度子智能体从多个知识源检索，并合成有依据的最终回答。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<mask id="label-gaps" maskUnits="userSpaceOnUse">
<rect x="0" y="0" width="690" height="620" fill="white"/>
<rect x="300" y="179" width="80" height="18" fill="black" rx="2"/>
<rect x="300" y="406" width="80" height="18" fill="black" rx="2"/>
<rect x="628" y="277" width="56" height="34" fill="black" rx="2"/>
</mask>
</defs>
<g onclick="sendPrompt('智能体 RAG 中用户问题是什么样的？')"><rect x="260" y="20" width="160" height="44" rx="8" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="340" y="42" text-anchor="middle" dominant-baseline="central" style="fill:#D3D1C7;font-size:14px;font-weight:500">用户问题</text></g>
<line x1="340" y1="64" x2="340" y2="100" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('智能体 RAG 中编排智能体的职责是什么？')"><rect x="200" y="100" width="280" height="56" rx="8" stroke-width="0.5" style="fill:#3C3489;stroke:#AFA9EC"/><text x="340" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#CECBF6;font-size:14px;font-weight:500">编排智能体</text><text x="340" y="140" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC;font-size:12px">规划、拆解任务、路由子任务</text></g>
<line x1="340" y1="156" x2="340" y2="192" marker-end="url(#arrow)" mask="url(#label-gaps)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<text x="340" y="188" text-anchor="middle" dominant-baseline="central" opacity="0.6" style="fill:#C2C0B6;font-size:12px">分发子智能体</text>
<g onclick="sendPrompt('向量检索子智能体是如何工作的？')"><rect x="30" y="210" width="135" height="56" rx="8" stroke-width="0.5" style="fill:#085041;stroke:#5DCAA5"/><text x="97" y="230" text-anchor="middle" dominant-baseline="central" style="fill:#9FE1CB;font-size:14px;font-weight:500">向量检索</text><text x="97" y="250" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">语义相似度匹配</text></g>
<g onclick="sendPrompt('结构化数据智能体在 RAG 中如何工作？')"><rect x="187" y="210" width="135" height="56" rx="8" stroke-width="0.5" style="fill:#085041;stroke:#5DCAA5"/><text x="254" y="230" text-anchor="middle" dominant-baseline="central" style="fill:#9FE1CB;font-size:14px;font-weight:500">SQL 智能体</text><text x="254" y="250" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">结构化数据查询</text></g>
<g onclick="sendPrompt('网络搜索智能体在智能体 RAG 中如何工作？')"><rect x="344" y="210" width="135" height="56" rx="8" stroke-width="0.5" style="fill:#085041;stroke:#5DCAA5"/><text x="411" y="230" text-anchor="middle" dominant-baseline="central" style="fill:#9FE1CB;font-size:14px;font-weight:500">网络搜索</text><text x="411" y="250" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">实时网页数据</text></g>
<g onclick="sendPrompt('工具调用智能体在智能体 RAG 中做什么？')"><rect x="501" y="210" width="148" height="56" rx="8" stroke-width="0.5" style="fill:#085041;stroke:#5DCAA5"/><text x="575" y="230" text-anchor="middle" dominant-baseline="central" style="fill:#9FE1CB;font-size:14px;font-weight:500">工具 / API 调用</text><text x="575" y="250" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">计算与执行动作</text></g>
<line x1="280" y1="156" x2="97" y2="210" marker-end="url(#arrow)" stroke-dasharray="4 3" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<line x1="315" y1="156" x2="254" y2="210" marker-end="url(#arrow)" stroke-dasharray="4 3" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<line x1="365" y1="156" x2="411" y2="210" marker-end="url(#arrow)" stroke-dasharray="4 3" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<line x1="400" y1="156" x2="575" y2="210" marker-end="url(#arrow)" stroke-dasharray="4 3" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('哪类文档适合存入向量数据库？')"><rect x="30" y="320" width="135" height="56" rx="8" stroke-width="0.5" style="fill:#0C447C;stroke:#85B7EB"/><text x="97" y="340" text-anchor="middle" dominant-baseline="central" style="fill:#B5D4F4;font-size:14px;font-weight:500">向量数据库</text><text x="97" y="358" text-anchor="middle" dominant-baseline="central" style="fill:#85B7EB;font-size:12px">嵌入向量存储</text></g>
<g onclick="sendPrompt('关系型数据库如何融入 RAG？')"><rect x="187" y="320" width="135" height="56" rx="8" stroke-width="0.5" style="fill:#0C447C;stroke:#85B7EB"/><text x="254" y="340" text-anchor="middle" dominant-baseline="central" style="fill:#B5D4F4;font-size:14px;font-weight:500">关系型数据库</text><text x="254" y="358" text-anchor="middle" dominant-baseline="central" style="fill:#85B7EB;font-size:12px">表格与行数据</text></g>
<g onclick="sendPrompt('实时网络检索与本地索引有何区别？')"><rect x="344" y="320" width="135" height="56" rx="8" stroke-width="0.5" style="fill:#0C447C;stroke:#85B7EB"/><text x="411" y="340" text-anchor="middle" dominant-baseline="central" style="fill:#B5D4F4;font-size:14px;font-weight:500">互联网</text><text x="411" y="358" text-anchor="middle" dominant-baseline="central" style="fill:#85B7EB;font-size:12px">实时网页内容</text></g>
<g onclick="sendPrompt('智能体 RAG 中哪些外部 API 比较实用？')"><rect x="501" y="320" width="148" height="56" rx="8" stroke-width="0.5" style="fill:#0C447C;stroke:#85B7EB"/><text x="575" y="340" text-anchor="middle" dominant-baseline="central" style="fill:#B5D4F4;font-size:14px;font-weight:500">外部 API</text><text x="575" y="358" text-anchor="middle" dominant-baseline="central" style="fill:#85B7EB;font-size:12px">SaaS、代码执行器</text></g>
<line x1="97" y1="266" x2="97" y2="320" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<line x1="254" y1="266" x2="254" y2="320" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<line x1="411" y1="266" x2="411" y2="320" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<line x1="575" y1="266" x2="575" y2="320" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<text x="340" y="415" text-anchor="middle" dominant-baseline="central" opacity="0.6" style="fill:#C2C0B6;font-size:12px">返回检索结果</text>
<line x1="97" y1="376" x2="260" y2="440" marker-end="url(#arrow)" stroke-dasharray="4 3" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<line x1="254" y1="376" x2="300" y2="440" marker-end="url(#arrow)" stroke-dasharray="4 3" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<line x1="411" y1="376" x2="380" y2="440" marker-end="url(#arrow)" stroke-dasharray="4 3" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<line x1="575" y1="376" x2="420" y2="440" marker-end="url(#arrow)" stroke-dasharray="4 3" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('智能体 RAG 中合成器如何整合多路结果？')"><rect x="200" y="440" width="280" height="56" rx="8" stroke-width="0.5" style="fill:#712B13;stroke:#F0997B"/><text x="340" y="460" text-anchor="middle" dominant-baseline="central" style="fill:#F5C4B3;font-size:14px;font-weight:500">合成器（LLM）</text><text x="340" y="478" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">重排序、消解冲突、生成引用</text></g>
<line x1="340" y1="496" x2="340" y2="540" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('智能体 RAG 中什么样的回答算有依据的好答案？')"><rect x="220" y="540" width="240" height="56" rx="8" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="340" y="560" text-anchor="middle" dominant-baseline="central" style="fill:#D3D1C7;font-size:14px;font-weight:500">有依据的最终答案</text><text x="340" y="578" text-anchor="middle" dominant-baseline="central" style="fill:#B4B2A9;font-size:12px">含引用与置信度</text></g>
<path d="M480 468 Q620 468 620 128 Q620 100 480 100" fill="none" stroke="#9C9A92" stroke-width="0.8" stroke-dasharray="5 4" marker-end="url(#arrow)" opacity="0.5" mask="url(#label-gaps)"/>
<text x="632" y="286" text-anchor="start" dominant-baseline="central" opacity="0.6" style="fill:#C2C0B6;font-size:12px">结果不足</text>
<text x="632" y="302" text-anchor="start" dominant-baseline="central" opacity="0.6" style="fill:#C2C0B6;font-size:12px">重新规划</text>
</svg>
