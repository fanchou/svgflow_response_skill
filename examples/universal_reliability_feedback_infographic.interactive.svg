<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Reliability Feedback Loop</title>
<desc>Feedback-loop infographic for observing incidents, prioritizing fixes, deploying mitigations, measuring health, and learning.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<mask id="reliability-label-gaps" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="560" fill="white"/><rect x="282" y="122" width="70" height="22" fill="black" rx="3"/><rect x="454" y="224" width="70" height="22" fill="black" rx="3"/><rect x="298" y="378" width="70" height="22" fill="black" rx="3"/><rect x="156" y="292" width="70" height="22" fill="black" rx="3"/></mask>
</defs>
<rect x="60" y="58" width="560" height="420" rx="12" fill="none" stroke="rgb(133, 183, 235)" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="76" y="82" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Reliability operating loop</text>
<path d="M224 148 L456 148" fill="none" stroke="rgb(133, 183, 235)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#reliability-label-gaps)"/>
<path d="M508 190 L508 316" fill="none" stroke="rgb(83, 74, 183)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#reliability-label-gaps)"/>
<path d="M456 374 L224 374" fill="none" stroke="rgb(93, 202, 165)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#reliability-label-gaps)"/>
<path d="M172 316 L172 190" fill="none" stroke="rgb(239, 159, 39)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#reliability-label-gaps)"/>
<path d="M238 414 Q340 490 442 414" fill="none" stroke="rgb(180, 178, 169)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<g><rect x="92" y="118" width="132" height="72" rx="8" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/><text x="158" y="144" text-anchor="middle" dominant-baseline="central" fill="rgb(181, 212, 244)" font-size="14" font-weight="500">Observe</text><text x="158" y="166" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">Alerts and traces</text></g>
<g><rect x="456" y="118" width="132" height="72" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/><text x="522" y="144" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14" font-weight="500">Prioritize</text><text x="522" y="166" text-anchor="middle" dominant-baseline="central" fill="rgb(175, 169, 236)" font-size="12">Severity first</text></g>
<g><rect x="456" y="316" width="132" height="72" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/><text x="522" y="342" text-anchor="middle" dominant-baseline="central" fill="rgb(159, 225, 203)" font-size="14" font-weight="500">Mitigate</text><text x="522" y="364" text-anchor="middle" dominant-baseline="central" fill="rgb(93, 202, 165)" font-size="12">Patch and isolate</text></g>
<g role="button" tabindex="0" aria-label="Explain reliability health measurement." onclick="sendPrompt('Explain reliability health measurement.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain reliability health measurement.')}"><rect x="92" y="316" width="132" height="72" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/><text x="158" y="342" text-anchor="middle" dominant-baseline="central" fill="rgb(250, 199, 117)" font-size="14" font-weight="500">Measure</text><text x="158" y="364" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">SLO health</text></g>
<g><rect x="238" y="404" width="204" height="54" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/><text x="340" y="424" text-anchor="middle" dominant-baseline="central" fill="rgb(211, 209, 199)" font-size="14" font-weight="500">Feed lessons back</text><text x="340" y="442" text-anchor="middle" dominant-baseline="central" fill="rgb(180, 178, 169)" font-size="12">Planning and prevention</text></g>
<rect x="282" y="122" width="70" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="317" y="136" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Triage</text>
<rect x="454" y="224" width="70" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="489" y="238" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Action</text>
<rect x="298" y="378" width="70" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="333" y="392" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Verify</text>
<rect x="156" y="292" width="70" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="191" y="306" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Insight</text>
<rect x="122" y="508" width="12" height="12" rx="2" fill="rgb(133, 183, 235)"/><text x="140" y="518" fill="rgb(194, 192, 182)" font-size="12">Data</text>
<rect x="280" y="508" width="12" height="12" rx="2" fill="rgb(175, 169, 236)"/><text x="298" y="518" fill="rgb(194, 192, 182)" font-size="12">Control</text>
<rect x="454" y="508" width="12" height="12" rx="2" fill="rgb(239, 159, 39)"/><text x="472" y="518" fill="rgb(194, 192, 182)" font-size="12">Feedback</text>
</svg>
