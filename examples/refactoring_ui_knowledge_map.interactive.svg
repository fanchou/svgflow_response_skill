<svg width="100%" viewBox="0 0 680 820" role="img" xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" lang="zh-CN" dir="ltr">
<title>Refactoring UI — 核心章节体系</title>
<desc>Refactoring UI 全书主题模块与核心设计原则结构图</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<style>
  .bg { fill: #1b1b1a; }
  .h { fill: #faf9f5; font: 500 14px "Anthropic Sans", -apple-system, system-ui, "Segoe UI", sans-serif; }
  .s { fill: #c2c0b6; font: 400 12px "Anthropic Sans", -apple-system, system-ui, "Segoe UI", sans-serif; }
  .arr { stroke: #9c9a92; stroke-width: 1.5; opacity: 0.3; fill: none; }
  .card { stroke-width: 0.5; cursor: pointer; }
  .violet { fill: #3c3489; stroke: #afa9ec; }
  .rust { fill: #712b13; stroke: #f0997b; }
  .blue { fill: #0c447c; stroke: #85b7eb; }
  .teal { fill: #085041; stroke: #5dcaa5; }
  .amber { fill: #633806; stroke: #ef9f27; }
  .green { fill: #27500a; stroke: #97c459; }
  .slate { fill: #444441; stroke: #b4b2a9; }
  .rose { fill: #72243e; stroke: #ed93b1; }
  .t-violet { fill: #cecbf6; }
  .t-rust { fill: #f5c4b3; }
  .t-blue { fill: #b5d4f4; }
  .t-teal { fill: #9fe1cb; }
  .t-amber { fill: #fac775; }
  .t-green { fill: #c0dd97; }
  .t-slate { fill: #d3d1c7; }
  .t-rose { fill: #f4c0d1; }
</style>

<rect class="bg" x="0" y="0" width="680" height="820"/>

<text class="h" x="340" y="36" text-anchor="middle">Refactoring UI — 全书知识体系</text>
<text class="s" x="340" y="56" text-anchor="middle">Adam Wathan &amp; Steve Schoger · 面向开发者的 UI 设计实战指南</text>

<g onclick="sendPrompt('详细介绍 Refactoring UI 第一章：从头开始的设计流程')">
  <rect class="card violet" x="40" y="76" width="280" height="58" rx="8"/>
  <text class="h t-violet" x="180" y="100" text-anchor="middle" dominant-baseline="central">1 · 从零开始</text>
  <text class="s" x="180" y="118" text-anchor="middle" dominant-baseline="central">先设计功能，而非布局框架</text>
</g>
<g onclick="sendPrompt('详细介绍 Refactoring UI 第二章：设计风格与个性')">
  <rect class="card rust" x="360" y="76" width="280" height="58" rx="8"/>
  <text class="h t-rust" x="500" y="100" text-anchor="middle" dominant-baseline="central">2 · 设计风格</text>
  <text class="s" x="500" y="118" text-anchor="middle" dominant-baseline="central">字体 · 颜色 · 圆角 · 语言基调</text>
</g>

<line class="arr" x1="340" y1="134" x2="340" y2="162" marker-end="url(#arrow)"/>

<g onclick="sendPrompt('详细介绍 Refactoring UI 视觉层级章节，包含字重、颜色对比技巧')">
  <rect class="card blue" x="40" y="164" width="580" height="66" rx="8"/>
  <text class="h t-blue" x="340" y="188" text-anchor="middle" dominant-baseline="central">3 · 视觉层级（Visual Hierarchy）</text>
  <text class="s" x="340" y="208" text-anchor="middle" dominant-baseline="central">用字重与颜色而非尺寸建立主次 · 限制 2-3 种字重和颜色 · 弱化次要信息</text>
</g>
<line class="arr" x1="340" y1="230" x2="340" y2="258" marker-end="url(#arrow)"/>

<g onclick="sendPrompt('详细介绍 Refactoring UI 布局与间距章节，包含间距系统和白空间技巧')">
  <rect class="card teal" x="40" y="260" width="580" height="66" rx="8"/>
  <text class="h t-teal" x="340" y="284" text-anchor="middle" dominant-baseline="central">4 · 布局与间距（Layout &amp; Spacing）</text>
  <text class="s" x="340" y="304" text-anchor="middle" dominant-baseline="central">先留足白空间再裁剪 · 建立间距系统（基础单位 16px）· 避免网格依赖</text>
</g>
<line class="arr" x1="340" y1="326" x2="340" y2="354" marker-end="url(#arrow)"/>

<g onclick="sendPrompt('详细介绍 Refactoring UI 文字排版章节，包含字号系统、行长、对齐技巧')">
  <rect class="card amber" x="40" y="356" width="580" height="66" rx="8"/>
  <text class="h t-amber" x="340" y="380" text-anchor="middle" dominant-baseline="central">5 · 文字排版（Typography）</text>
  <text class="s" x="340" y="400" text-anchor="middle" dominant-baseline="central">建立字号刻度 · 行长 45-75 字符 · 基线对齐 · 合理行高</text>
</g>
<line class="arr" x1="340" y1="422" x2="340" y2="450" marker-end="url(#arrow)"/>

<g onclick="sendPrompt('详细介绍 Refactoring UI 颜色章节，包含 HSL 色彩系统和调色板构建')">
  <rect class="card green" x="40" y="452" width="580" height="66" rx="8"/>
  <text class="h t-green" x="340" y="476" text-anchor="middle" dominant-baseline="central">6 · 颜色系统（Colors）</text>
  <text class="s" x="340" y="496" text-anchor="middle" dominant-baseline="central">用 HSL 替代 HEX · 灰色 8-10 阶 · 主色 5-10 阶 · 感知亮度公式</text>
</g>
<line class="arr" x1="340" y1="518" x2="340" y2="546" marker-end="url(#arrow)"/>

<g onclick="sendPrompt('详细介绍 Refactoring UI 深度与阴影章节，包含光源模拟和层次系统')">
  <rect class="card slate" x="40" y="548" width="280" height="66" rx="8"/>
  <text class="h t-slate" x="180" y="572" text-anchor="middle" dominant-baseline="central">7 · 深度与阴影</text>
  <text class="s" x="180" y="592" text-anchor="middle" dominant-baseline="central">模拟顶部光源 · 5 级阴影系统</text>
</g>
<g onclick="sendPrompt('详细介绍 Refactoring UI 精修技巧章节，包括超级椭圆、边框、空状态设计')">
  <rect class="card rose" x="360" y="548" width="280" height="66" rx="8"/>
  <text class="h t-rose" x="500" y="572" text-anchor="middle" dominant-baseline="central">8 · 精修细节</text>
  <text class="s" x="500" y="592" text-anchor="middle" dominant-baseline="central">空状态 · 强调色 · 图标与图片</text>
</g>

<line x1="40" y1="640" x2="640" y2="640" stroke="rgba(222,220,209,0.3)" stroke-width="0.5" opacity="0.4"/>
<text class="h" x="340" y="666" text-anchor="middle">核心设计原则</text>

<g onclick="sendPrompt('什么是 Refactoring UI 中的设计系统方法？')">
  <rect class="card violet" x="40" y="682" width="174" height="44" rx="8"/>
  <text class="h t-violet" x="127" y="704" text-anchor="middle" dominant-baseline="central">限制选择</text>
</g>
<g onclick="sendPrompt('Refactoring UI 如何建立间距和字号系统？')">
  <rect class="card blue" x="233" y="682" width="174" height="44" rx="8"/>
  <text class="h t-blue" x="320" y="704" text-anchor="middle" dominant-baseline="central">建立系统</text>
</g>
<g onclick="sendPrompt('Refactoring UI 中如何先做低保真设计？')">
  <rect class="card teal" x="426" y="682" width="174" height="44" rx="8"/>
  <text class="h t-teal" x="513" y="704" text-anchor="middle" dominant-baseline="central">低保真优先</text>
</g>
<g onclick="sendPrompt('Refactoring UI 的目标读者和核心价值是什么？')">
  <rect class="card rust" x="40" y="742" width="174" height="44" rx="8"/>
  <text class="h t-rust" x="127" y="764" text-anchor="middle" dominant-baseline="central">从功能出发</text>
</g>
<g onclick="sendPrompt('Refactoring UI 怎么看待颜色与无障碍设计？')">
  <rect class="card amber" x="233" y="742" width="174" height="44" rx="8"/>
  <text class="h t-amber" x="320" y="764" text-anchor="middle" dominant-baseline="central">颜色辅助信息</text>
</g>
<g onclick="sendPrompt('如何用 Refactoring UI 的方法研究和学习好的设计？')">
  <rect class="card green" x="426" y="742" width="174" height="44" rx="8"/>
  <text class="h t-green" x="513" y="764" text-anchor="middle" dominant-baseline="central">观察与临摹</text>
</g>

<text class="s" x="340" y="808" text-anchor="middle">点击任意模块，深入了解该章节内容 ↗</text>
</svg>
