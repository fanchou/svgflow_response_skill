<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Product Rollout Roadmap</title>
<desc>Timeline infographic with four rollout phases, readiness gates, risk, legend, and clickable inspection.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<mask id="roadmap-label-gaps" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="560" fill="white"/><rect x="172" y="222" width="64" height="22" fill="black" rx="3"/><rect x="316" y="222" width="64" height="22" fill="black" rx="3"/><rect x="460" y="222" width="64" height="22" fill="black" rx="3"/><rect x="280" y="120" width="68" height="22" fill="black" rx="3"/></mask>
</defs>
<rect x="40" y="54" width="600" height="330" rx="12" fill="none" stroke="rgb(133, 183, 235)" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="56" y="78" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">2026 rollout phases</text>
<path d="M116 232 L564 232" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#roadmap-label-gaps)"/>
<path d="M196 152 L196 210" fill="none" stroke="rgb(93, 202, 165)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M340 152 L340 210" fill="none" stroke="rgb(93, 202, 165)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M500 152 L500 210" fill="none" stroke="rgb(93, 202, 165)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M156 376 L156 124 L252 124" fill="none" stroke="rgb(216, 90, 48)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)" mask="url(#roadmap-label-gaps)"/>
<g><rect x="74" y="260" width="120" height="82" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/><text x="134" y="286" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14" font-weight="500">Discovery</text><text x="134" y="306" text-anchor="middle" dominant-baseline="central" fill="rgb(175, 169, 236)" font-size="12">Q1 user gaps</text><text x="134" y="324" text-anchor="middle" dominant-baseline="central" fill="rgb(175, 169, 236)" font-size="12">Milestone map</text></g>
<g role="button" tabindex="0" aria-label="Explain the pilot readiness gate." onclick="sendPrompt('Explain the pilot readiness gate.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain the pilot readiness gate.')}"><rect x="218" y="260" width="120" height="82" rx="8" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/><text x="278" y="286" text-anchor="middle" dominant-baseline="central" fill="rgb(181, 212, 244)" font-size="14" font-weight="500">Pilot</text><text x="278" y="306" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">Q2 one cohort</text><text x="278" y="324" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">Readiness gate</text></g>
<g><rect x="362" y="260" width="120" height="82" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/><text x="422" y="286" text-anchor="middle" dominant-baseline="central" fill="rgb(159, 225, 203)" font-size="14" font-weight="500">Rollout</text><text x="422" y="306" text-anchor="middle" dominant-baseline="central" fill="rgb(93, 202, 165)" font-size="12">Q3 expand</text><text x="422" y="324" text-anchor="middle" dominant-baseline="central" fill="rgb(93, 202, 165)" font-size="12">Guardrails on</text></g>
<g><rect x="506" y="260" width="120" height="82" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/><text x="566" y="286" text-anchor="middle" dominant-baseline="central" fill="rgb(250, 199, 117)" font-size="14" font-weight="500">Adoption</text><text x="566" y="306" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">Q4 scale</text><text x="566" y="324" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">Operate steady</text></g>
<g><rect x="72" y="92" width="168" height="64" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/><text x="156" y="116" text-anchor="middle" dominant-baseline="central" fill="rgb(245, 196, 179)" font-size="14" font-weight="500">Readiness risk</text><text x="156" y="136" text-anchor="middle" dominant-baseline="central" fill="rgb(240, 153, 123)" font-size="12">Gate failure delays next</text></g>
<rect x="172" y="222" width="64" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="204" y="236" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Gate 1</text>
<rect x="316" y="222" width="64" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="348" y="236" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Gate 2</text>
<rect x="460" y="222" width="64" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="492" y="236" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Gate 3</text>
<rect x="280" y="120" width="68" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="314" y="134" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Blocks</text>
<rect x="118" y="504" width="12" height="12" rx="2" fill="rgb(133, 183, 235)"/><text x="136" y="514" fill="rgb(194, 192, 182)" font-size="12">Phase</text>
<rect x="270" y="504" width="12" height="12" rx="2" fill="rgb(93, 202, 165)"/><text x="288" y="514" fill="rgb(194, 192, 182)" font-size="12">Gate</text>
<rect x="410" y="504" width="12" height="12" rx="2" fill="rgb(240, 153, 123)"/><text x="428" y="514" fill="rgb(194, 192, 182)" font-size="12">Risk</text>
</svg>
