<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Product Growth Insight Map</title>
<desc>Freeform infographic from a realistic assistant response with mixed growth signals, risks, recommendations, and evidence.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<mask id="growth-label-gaps" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="620" fill="white"/><rect x="248" y="158" width="70" height="22" fill="black" rx="3"/><rect x="352" y="238" width="78" height="22" fill="black" rx="3"/><rect x="398" y="356" width="92" height="22" fill="black" rx="3"/><rect x="208" y="392" width="76" height="22" fill="black" rx="3"/></mask>
</defs>
<rect x="38" y="58" width="604" height="410" rx="12" fill="none" stroke="rgb(133, 183, 235)" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="54" y="82" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Mixed growth signals</text>
<rect x="260" y="486" width="340" height="62" rx="12" fill="none" stroke="rgb(175, 169, 236)" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="276" y="510" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Action and evidence</text>
<path d="M202 162 L330 162" fill="none" stroke="rgb(216, 90, 48)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#growth-label-gaps)"/>
<path d="M410 190 L448 276" fill="none" stroke="rgb(133, 183, 235)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#growth-label-gaps)"/>
<path d="M516 340 L456 420" fill="none" stroke="rgb(93, 202, 165)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#growth-label-gaps)"/>
<path d="M278 350 L368 420" fill="none" stroke="rgb(239, 159, 39)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#growth-label-gaps)"/>
<path d="M430 548 L430 478" fill="none" stroke="rgb(180, 178, 169)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<g role="button" tabindex="0" aria-label="Explain why setup friction blocks activation." onclick="sendPrompt('Explain why setup friction blocks activation.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain why setup friction blocks activation.')}"><rect x="72" y="126" width="130" height="72" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/><text x="137" y="152" text-anchor="middle" dominant-baseline="central" fill="rgb(245, 196, 179)" font-size="14" font-weight="500">Setup friction</text><text x="137" y="174" text-anchor="middle" dominant-baseline="central" fill="rgb(240, 153, 123)" font-size="12">Too much config</text></g>
<g role="button" tabindex="0" aria-label="Explain how guided activation improves completion." onclick="sendPrompt('Explain how guided activation improves completion.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain how guided activation improves completion.')}"><rect x="330" y="126" width="160" height="72" rx="8" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/><text x="410" y="152" text-anchor="middle" dominant-baseline="central" fill="rgb(181, 212, 244)" font-size="14" font-weight="500">Guided activation</text><text x="410" y="174" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">Improves completion</text></g>
<g role="button" tabindex="0" aria-label="Explain how collaboration expands workspace adoption." onclick="sendPrompt('Explain how collaboration expands workspace adoption.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain how collaboration expands workspace adoption.')}"><rect x="470" y="292" width="140" height="72" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/><text x="540" y="318" text-anchor="middle" dominant-baseline="central" fill="rgb(159, 225, 203)" font-size="14" font-weight="500">Collaboration</text><text x="540" y="340" text-anchor="middle" dominant-baseline="central" fill="rgb(93, 202, 165)" font-size="12">Three invites expand</text></g>
<g role="button" tabindex="0" aria-label="Explain why permission tickets constrain growth." onclick="sendPrompt('Explain why permission tickets constrain growth.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain why permission tickets constrain growth.')}"><rect x="164" y="304" width="150" height="72" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/><text x="239" y="330" text-anchor="middle" dominant-baseline="central" fill="rgb(250, 199, 117)" font-size="14" font-weight="500">Permission tickets</text><text x="239" y="352" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">Admin model unclear</text></g>
<g role="button" tabindex="0" aria-label="Explain the recommended product growth move." onclick="sendPrompt('Explain the recommended product growth move.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain the recommended product growth move.')}"><rect x="310" y="416" width="240" height="62" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/><text x="430" y="440" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14" font-weight="500">Recommended move</text><text x="430" y="460" text-anchor="middle" dominant-baseline="central" fill="rgb(175, 169, 236)" font-size="12">Simplify, invite, preset</text></g>
<g role="button" tabindex="0" aria-label="Explain the metrics that validate this insight map." onclick="sendPrompt('Explain the metrics that validate this insight map.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain the metrics that validate this insight map.')}"><rect x="284" y="526" width="292" height="54" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/><text x="430" y="546" text-anchor="middle" dominant-baseline="central" fill="rgb(211, 209, 199)" font-size="14" font-weight="500">Metrics to watch</text><text x="430" y="564" text-anchor="middle" dominant-baseline="central" fill="rgb(180, 178, 169)" font-size="12">Shared workspace and tickets</text></g>
<rect x="248" y="158" width="70" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="283" y="172" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Blocks</text>
<rect x="352" y="238" width="78" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="391" y="252" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Supports</text>
