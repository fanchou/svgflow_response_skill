<rect x="208" y="392" width="76" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="246" y="406" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Constrains</text>
<rect x="104" y="596" width="12" height="12" rx="2" fill="rgb(133, 183, 235)"/><text x="122" y="606" fill="rgb(194, 192, 182)" font-size="12">Signal</text>
<rect x="264" y="596" width="12" height="12" rx="2" fill="rgb(240, 153, 123)"/><text x="282" y="606" fill="rgb(194, 192, 182)" font-size="12">Risk</text>
<rect x="414" y="596" width="12" height="12" rx="2" fill="rgb(175, 169, 236)"/><text x="432" y="606" fill="rgb(194, 192, 182)" font-size="12">Action</text>
</svg>
