<svg width="100%" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>强化学习智能体与数字孪生环境的交互闭环</title>
<desc>智能体观察状态、选择动作、孪生环境执行并返回奖励和新状态，形成训练闭环</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<mask id="label-gaps" maskUnits="userSpaceOnUse">
<rect x="0" y="0" width="680" height="380" fill="white"/>
<rect x="285" y="148" width="80" height="22" fill="black" rx="5"/>
<rect x="285" y="193" width="80" height="22" fill="black" rx="5"/>
<rect x="285" y="233" width="80" height="22" fill="black" rx="5"/>
</mask>
</defs>
<g onclick="sendPrompt('强化学习策略网络的神经网络结构如何设计？')">
<rect x="40" y="130" width="180" height="120" rx="12" stroke-width="0.5" style="fill:#3C3489;stroke:#AFA9EC"/>
<text x="130" y="165" text-anchor="middle" dominant-baseline="central" style="fill:#CECBF6;font-size:14px;font-weight:500">RL 智能体</text>
<text x="130" y="185" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC;font-size:12px">策略网络 π(a|s)</text>
<text x="130" y="205" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC;font-size:12px">价值网络 V(s)</text>
<text x="130" y="225" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC;font-size:12px">经验回放缓冲</text>
</g>
<g onclick="sendPrompt('数字孪生作为 RL 训练环境需要满足哪些接口规范？')">
<rect x="460" y="80" width="180" height="220" rx="12" stroke-width="0.5" style="fill:#085041;stroke:#5DCAA5"/>
<text x="550" y="115" text-anchor="middle" dominant-baseline="central" style="fill:#9FE1CB;font-size:14px;font-weight:500">数字孪生环境</text>
<text x="550" y="135" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">物理/行为模型</text>
<text x="550" y="155" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">状态转移函数</text>
<text x="550" y="175" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">约束检验器</text>
<text x="550" y="195" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">奖励计算器</text>
<text x="550" y="215" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">并行仿真 xN</text>
<text x="550" y="235" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">时间加速 x1000</text>
<text x="550" y="265" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">OpenAI Gym 接口</text>
</g>
<path d="M220 165 L458 165" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)" mask="url(#label-gaps)"/>
<rect x="285" y="148" width="80" height="22" rx="5" stroke-width="0.5" style="fill:#262624;stroke:#464641"/>
<text x="325" y="162" text-anchor="middle" dominant-baseline="central" style="fill:#C2C0B6;font-size:12px">动作 a_t</text>
<path d="M460 210 L222 210" fill="none" stroke="#534AB7" stroke-width="2" marker-end="url(#arrow)" mask="url(#label-gaps)"/>
<rect x="285" y="193" width="80" height="22" rx="5" stroke-width="0.5" style="fill:#262624;stroke:#464641"/>
<text x="325" y="207" text-anchor="middle" dominant-baseline="central" style="fill:#C2C0B6;font-size:12px">状态 s_t</text>
<path d="M460 250 L222 250" fill="none" stroke="#BA7517" stroke-width="2" marker-end="url(#arrow)" mask="url(#label-gaps)"/>
<rect x="285" y="233" width="80" height="22" rx="5" stroke-width="0.5" style="fill:#262624;stroke:#464641"/>
<text x="325" y="247" text-anchor="middle" dominant-baseline="central" style="fill:#C2C0B6;font-size:12px">奖励 r_t</text>
<g onclick="sendPrompt('训练好的 RL 策略如何安全部署到真实 IoT 设备？')">
<rect x="220" y="320" width="240" height="44" rx="8" stroke-width="0.5" style="fill:#712B13;stroke:#F0997B"/>
<text x="340" y="338" text-anchor="middle" dominant-baseline="central" style="fill:#F5C4B3;font-size:14px;font-weight:500">真实物理设备</text>
<text x="340" y="355" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">策略部署 · 安全边界校验</text>
</g>
<path d="M550 300 L550 342 L462 342" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="570" y="326" text-anchor="start" style="fill:#C2C0B6;font-size:12px">部署</text>
<path d="M220 342 L130 342 L130 252" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="60" y="310" text-anchor="start" style="fill:#C2C0B6;font-size:12px">实测校准</text>
<rect x="270" y="290" width="140" height="24" rx="6" stroke-width="0.5" style="fill:#262624;stroke:#464641"/>
<text x="340" y="305" text-anchor="middle" dominant-baseline="central" style="fill:#C2C0B6;font-size:12px">安全约束过滤层</text>
<line x1="340" y1="314" x2="340" y2="320" stroke="#9C9A92" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>
</svg>
