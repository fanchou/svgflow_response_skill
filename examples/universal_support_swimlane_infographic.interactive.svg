<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Support Workflow Swimlane</title>
<desc>A universal swimlane workflow across customer, support, engineering, and operations lanes with orthogonal routing and clickable triage.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<mask id="swimlane-label-gaps" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="560" fill="white"/><rect x="188" y="138" width="72" height="22" fill="black" rx="3"/><rect x="330" y="248" width="80" height="22" fill="black" rx="3"/></mask>
</defs>
<rect x="40" y="52" width="600" height="82" rx="10" fill="none" stroke="rgb(180, 178, 169)" stroke-width="0.8" stroke-dasharray="5 4"/><text x="56" y="78" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Customer</text>
<rect x="40" y="162" width="600" height="82" rx="10" fill="none" stroke="rgb(133, 183, 235)" stroke-width="0.8" stroke-dasharray="5 4"/><text x="56" y="188" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Support</text>
<rect x="40" y="272" width="600" height="82" rx="10" fill="none" stroke="rgb(175, 169, 236)" stroke-width="0.8" stroke-dasharray="5 4"/><text x="56" y="298" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Engineering</text>
<rect x="40" y="382" width="600" height="82" rx="10" fill="none" stroke="rgb(93, 202, 165)" stroke-width="0.8" stroke-dasharray="5 4"/><text x="56" y="408" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Operations</text>
<g><rect x="110" y="76" width="130" height="44" rx="8" fill="rgb(68, 68, 65)" stroke="rgb(180, 178, 169)" stroke-width="0.5"/><text x="175" y="98" text-anchor="middle" dominant-baseline="central" fill="rgb(211, 209, 199)" font-size="14" font-weight="500">Report issue</text></g>
<g role="button" tabindex="0" aria-label="Explain support triage criteria." onclick="sendPrompt('Explain support triage criteria.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain support triage criteria.')}"><rect x="260" y="186" width="130" height="44" rx="8" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/><text x="325" y="208" text-anchor="middle" dominant-baseline="central" fill="rgb(181, 212, 244)" font-size="14" font-weight="500">Triage</text></g>
<g><rect x="410" y="296" width="130" height="44" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/><text x="475" y="318" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14" font-weight="500">Fix defect</text></g>
<g><rect x="410" y="406" width="130" height="44" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/><text x="475" y="428" text-anchor="middle" dominant-baseline="central" fill="rgb(159, 225, 203)" font-size="14" font-weight="500">Deploy fix</text></g>
<g><rect x="110" y="186" width="130" height="44" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/><text x="175" y="208" text-anchor="middle" dominant-baseline="central" fill="rgb(250, 199, 117)" font-size="14" font-weight="500">Close loop</text></g>
<path d="M240 98 L325 98 L325 184" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#swimlane-label-gaps)"/>
<path d="M390 208 L475 208 L475 294" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#swimlane-label-gaps)"/>
<path d="M475 340 L475 404" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M410 428 L175 428 L175 232" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="188" y="138" width="72" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="224" y="152" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Ticket</text>
<rect x="330" y="248" width="80" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="370" y="262" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Escalate</text>
<rect x="150" y="520" width="12" height="12" rx="2" fill="rgb(133, 183, 235)"/><text x="168" y="530" fill="rgb(194, 192, 182)" font-size="12">Owner</text>
<rect x="290" y="520" width="12" height="12" rx="2" fill="rgb(175, 169, 236)"/><text x="308" y="530" fill="rgb(194, 192, 182)" font-size="12">Build</text>
<rect x="410" y="520" width="12" height="12" rx="2" fill="rgb(93, 202, 165)"/><text x="428" y="530" fill="rgb(194, 192, 182)" font-size="12">Run</text>
</svg>
