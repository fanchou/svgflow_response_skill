<svg width="100%" viewBox="0 0 680 1080" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Flutter 渲染全流程</title>
<desc>Flutter 从 Vsync 信号到 GPU 像素的完整渲染管线，包含 Build、Layout、Paint、Composite 各阶段</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<mask id="label-gaps" maskUnits="userSpaceOnUse">
<rect x="0" y="0" width="680" height="1080" fill="white"/>
<rect x="156" y="448" width="72" height="20" fill="black" rx="2"/>
<rect x="452" y="448" width="72" height="20" fill="black" rx="2"/>
</mask>
</defs>
<g onclick="sendPrompt('Flutter 中 Vsync 信号是什么，如何触发帧渲染？')"><rect x="220" y="20" width="240" height="44" rx="8" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="340" y="42" text-anchor="middle" dominant-baseline="central" style="fill:#D3D1C7;font-size:14px;font-weight:500">① Vsync 信号</text></g>
<text x="474" y="44" dominant-baseline="central" style="fill:#C2C0B6;font-size:12px">平台每帧回调</text>
<line x1="340" y1="64" x2="340" y2="90" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('WidgetsBinding.drawFrame() 做了什么？')"><rect x="170" y="90" width="340" height="56" rx="8" stroke-width="0.5" style="fill:#3C3489;stroke:#AFA9EC"/><text x="340" y="112" text-anchor="middle" dominant-baseline="central" style="fill:#CECBF6;font-size:14px;font-weight:500">② WidgetsBinding.drawFrame()</text><text x="340" y="132" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC;font-size:12px">整个渲染管线的入口</text></g>
<line x1="340" y1="146" x2="340" y2="172" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<rect x="40" y="172" width="600" height="210" rx="12" fill="none" stroke="#AFA9EC" stroke-width="0.8" stroke-dasharray="5,4"/>
<text x="52" y="190" style="fill:#C2C0B6;font-size:12px;font-weight:500">Build 阶段</text>
<g onclick="sendPrompt('Flutter Widget Tree 是什么？它有什么特点？')"><rect x="60" y="200" width="170" height="56" rx="8" stroke-width="0.5" style="fill:#3C3489;stroke:#AFA9EC"/><text x="145" y="222" text-anchor="middle" dominant-baseline="central" style="fill:#CECBF6;font-size:14px;font-weight:500">Widget Tree</text><text x="145" y="242" text-anchor="middle" dominant-baseline="central" style="fill:#AFA9EC;font-size:12px">不可变描述 / 轻量</text></g>
<line x1="230" y1="228" x2="266" y2="228" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('Flutter Element Tree 的作用是什么？')"><rect x="266" y="200" width="170" height="56" rx="8" stroke-width="0.5" style="fill:#085041;stroke:#5DCAA5"/><text x="351" y="222" text-anchor="middle" dominant-baseline="central" style="fill:#9FE1CB;font-size:14px;font-weight:500">Element Tree</text><text x="351" y="242" text-anchor="middle" dominant-baseline="central" style="fill:#5DCAA5;font-size:12px">长生命周期 / 协调</text></g>
<line x1="436" y1="228" x2="472" y2="228" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('Flutter RenderObject Tree 负责哪些工作？')"><rect x="472" y="200" width="168" height="56" rx="8" stroke-width="0.5" style="fill:#712B13;stroke:#F0997B"/><text x="556" y="222" text-anchor="middle" dominant-baseline="central" style="fill:#F5C4B3;font-size:14px;font-weight:500">RenderObject Tree</text><text x="556" y="242" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">可变 / 真实渲染</text></g>
<g onclick="sendPrompt('BuildOwner.buildScope() 是如何工作的？')"><rect x="140" y="294" width="400" height="44" rx="8" stroke-width="0.5" style="fill:#3C3489;stroke:#AFA9EC"/><text x="340" y="316" text-anchor="middle" dominant-baseline="central" style="fill:#CECBF6;font-size:14px;font-weight:500">BuildOwner.buildScope() — 重建脏 Element</text></g>
<line x1="340" y1="338" x2="340" y2="364" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<rect x="40" y="364" width="600" height="130" rx="12" fill="none" stroke="#9FE1CB" stroke-width="0.8" stroke-dasharray="5,4"/>
<text x="52" y="382" style="fill:#C2C0B6;font-size:12px;font-weight:500">Layout 阶段</text>
<g onclick="sendPrompt('Flutter flushLayout 是怎么进行约束传递和尺寸计算的？')"><rect x="140" y="390" width="400" height="44" rx="8" stroke-width="0.5" style="fill:#085041;stroke:#5DCAA5"/><text x="340" y="412" text-anchor="middle" dominant-baseline="central" style="fill:#9FE1CB;font-size:14px;font-weight:500">PipelineOwner.flushLayout()</text></g>
<text x="192" y="462" text-anchor="middle" style="fill:#C2C0B6;font-size:12px">约束 向下传</text>
<line x1="210" y1="434" x2="170" y2="468" marker-end="url(#arrow)" mask="url(#label-gaps)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<text x="488" y="462" text-anchor="middle" style="fill:#C2C0B6;font-size:12px">尺寸 向上返</text>
<line x1="470" y1="468" x2="430" y2="434" marker-end="url(#arrow)" mask="url(#label-gaps)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<line x1="340" y1="434" x2="340" y2="476" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('flushCompositingBits 有什么作用？什么是 compositing layer？')"><rect x="140" y="476" width="400" height="56" rx="8" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="340" y="498" text-anchor="middle" dominant-baseline="central" style="fill:#D3D1C7;font-size:14px;font-weight:500">PipelineOwner.flushCompositingBits()</text><text x="340" y="518" text-anchor="middle" dominant-baseline="central" style="fill:#B4B2A9;font-size:12px">更新合成位 / 确定哪些节点需要独立 Layer</text></g>
<line x1="340" y1="532" x2="340" y2="558" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<rect x="40" y="558" width="600" height="160" rx="12" fill="none" stroke="#F5C4B3" stroke-width="0.8" stroke-dasharray="5,4"/>
<text x="52" y="576" style="fill:#C2C0B6;font-size:12px;font-weight:500">Paint 阶段</text>
<g onclick="sendPrompt('Flutter flushPaint 是如何把 RenderObject 绘制成 Layer Tree 的？')"><rect x="140" y="584" width="400" height="44" rx="8" stroke-width="0.5" style="fill:#712B13;stroke:#F0997B"/><text x="340" y="606" text-anchor="middle" dominant-baseline="central" style="fill:#F5C4B3;font-size:14px;font-weight:500">PipelineOwner.flushPaint()</text></g>
<g onclick="sendPrompt('PaintingContext 和 Canvas 有什么区别？')"><rect x="80" y="648" width="180" height="44" rx="8" stroke-width="0.5" style="fill:#712B13;stroke:#F0997B"/><text x="170" y="666" text-anchor="middle" dominant-baseline="central" style="fill:#F5C4B3;font-size:14px;font-weight:500">PaintingContext</text><text x="170" y="684" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">持有 Canvas</text></g>
<line x1="260" y1="670" x2="300" y2="670" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('Flutter 的 Layer Tree 结构是什么？有哪些 Layer 类型？')"><rect x="300" y="648" width="180" height="44" rx="8" stroke-width="0.5" style="fill:#712B13;stroke:#F0997B"/><text x="390" y="666" text-anchor="middle" dominant-baseline="central" style="fill:#F5C4B3;font-size:14px;font-weight:500">Layer Tree</text><text x="390" y="684" text-anchor="middle" dominant-baseline="central" style="fill:#F0997B;font-size:12px">Picture / Offset / Clip…</text></g>
<line x1="498" y1="670" x2="498" y2="628" style="fill:none;stroke:#9C9A92;stroke-width:1px"/>
<line x1="498" y1="628" x2="340" y2="628" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<line x1="340" y1="692" x2="340" y2="718" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('renderView.compositeFrame() 如何将 Layer Tree 发送给 GPU？')"><rect x="140" y="718" width="400" height="56" rx="8" stroke-width="0.5" style="fill:#633806;stroke:#EF9F27"/><text x="340" y="740" text-anchor="middle" dominant-baseline="central" style="fill:#FAC775;font-size:14px;font-weight:500">RenderView.compositeFrame()</text><text x="340" y="760" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;font-size:12px">Scene → Engine → GPU 栅格化</text></g>
<line x1="340" y1="774" x2="340" y2="800" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('Flutter flushSemantics 是什么？和无障碍有什么关系？')"><rect x="140" y="800" width="400" height="56" rx="8" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="340" y="822" text-anchor="middle" dominant-baseline="central" style="fill:#D3D1C7;font-size:14px;font-weight:500">PipelineOwner.flushSemantics()</text><text x="340" y="842" text-anchor="middle" dominant-baseline="central" style="fill:#B4B2A9;font-size:12px">无障碍语义树 → 操作系统</text></g>
<line x1="340" y1="856" x2="340" y2="882" marker-end="url(#arrow)" style="fill:none;stroke:#9C9A92;stroke-width:1.5px"/>
<g onclick="sendPrompt('Flutter GPU 线程和 UI 线程是如何协作的？')"><rect x="220" y="882" width="240" height="56" rx="8" stroke-width="0.5" style="fill:#633806;stroke:#EF9F27"/><text x="340" y="904" text-anchor="middle" dominant-baseline="central" style="fill:#FAC775;font-size:14px;font-weight:500">GPU / Skia / Impeller</text><text x="340" y="924" text-anchor="middle" dominant-baseline="central" style="fill:#EF9F27;font-size:12px">光栅化 → 屏幕像素</text></g>
<g onclick="sendPrompt('buildOwner.finalizeTree() 做了什么？')"><rect x="500" y="340" width="148" height="44" rx="8" stroke-width="0.5" style="fill:#444441;stroke:#B4B2A9"/><text x="574" y="358" text-anchor="middle" dominant-baseline="central" style="fill:#D3D1C7;font-size:14px;font-weight:500">finalizeTree()</text><text x="574" y="374" text-anchor="middle" dominant-baseline="central" style="fill:#B4B2A9;font-size:12px">销毁失活 Element</text></g>
<line x1="500" y1="362" x2="474" y2="362" stroke="#9C9A92" stroke-width="0.8" stroke-dasharray="3,3"/>
<g>
<rect x="40" y="958" width="12" height="12" rx="2" fill="#AFA9EC"/><text x="58" y="968" style="fill:#C2C0B6;font-size:12px">Widget / Element</text>
<rect x="160" y="958" width="12" height="12" rx="2" fill="#5DCAA5"/><text x="178" y="968" style="fill:#C2C0B6;font-size:12px">Layout</text>
<rect x="258" y="958" width="12" height="12" rx="2" fill="#F0997B"/><text x="276" y="968" style="fill:#C2C0B6;font-size:12px">Paint</text>
<rect x="336" y="958" width="12" height="12" rx="2" fill="#EF9F27"/><text x="354" y="968" style="fill:#C2C0B6;font-size:12px">Composite / GPU</text>
<rect x="470" y="958" width="12" height="12" rx="2" fill="#B4B2A9"/><text x="488" y="968" style="fill:#C2C0B6;font-size:12px">辅助 / 无障碍</text>
</g>
<text x="340" y="1000" text-anchor="middle" style="fill:#C2C0B6;font-size:12px">点击节点可提问</text>
</svg>
