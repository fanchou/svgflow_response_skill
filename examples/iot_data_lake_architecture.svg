<svg class="svgflow" data-svgflow-id="iot-data-lake-layers" width="100%" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img" xml:lang="zh-CN" lang="zh-CN" dir="ltr">
  <title>IoT 数据湖分层架构</title>
  <desc>从设备接入到消费层的五层结构：接入层、流处理层、存储层三分区、服务层、消费层。</desc>
  <defs>
    <marker id="svgflow-iot-data-lake-layers-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg{fill:#141412}.layer-title{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif}.layer-sub{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif}.chip{font:500 12px system-ui,-apple-system,"Segoe UI",sans-serif}.zone-title{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif}.zone-line{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif}.flow{fill:none;stroke:#9c9a92;stroke-width:1;opacity:.45;marker-end:url(#svgflow-iot-data-lake-layers-arrow)}.foot{font:400 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#c2c0b6}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="680"/>

  <rect x="40" y="30" width="600" height="72" rx="12" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="58" text-anchor="middle" dominant-baseline="central" fill="rgb(245,196,179)">接入层</text>
  <text class="layer-sub" x="340" y="78" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)">MQTT · Kafka · HTTP · CoAP · OPC-UA</text>
  <g role="button" tabindex="0" aria-label="消息队列缓冲" onclick="sendPrompt('IoT数据接入层如何做协议适配、消息缓冲和背压控制？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT数据接入层如何做协议适配、消息缓冲和背压控制？')}">
    <rect x="60" y="88" width="150" height="30" rx="6" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
    <text class="chip" x="135" y="107" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)">消息队列缓冲</text>
  </g>
  <g role="button" tabindex="0" aria-label="设备连接管理" onclick="sendPrompt('IoT接入层如何做设备认证、连接管理和租户隔离？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT接入层如何做设备认证、连接管理和租户隔离？')}">
    <rect x="230" y="88" width="150" height="30" rx="6" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
    <text class="chip" x="305" y="107" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)">设备连接管理</text>
  </g>
  <g role="button" tabindex="0" aria-label="Schema注册" onclick="sendPrompt('IoT数据接入时如何做格式标准化和Schema注册？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT数据接入时如何做格式标准化和Schema注册？')}">
    <rect x="400" y="88" width="150" height="30" rx="6" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
    <text class="chip" x="475" y="107" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)">Schema 注册</text>
  </g>

  <path class="flow" d="M340 118 L340 143" fill="none"/>

  <rect x="40" y="145" width="600" height="72" rx="12" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="173" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)">流处理层</text>
  <text class="layer-sub" x="340" y="193" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)">实时计算 · 异常检测 · 数据清洗 · 特征提取</text>
  <g role="button" tabindex="0" aria-label="窗口聚合与CEP" onclick="sendPrompt('IoT流处理中窗口聚合和CEP复杂事件处理如何实现？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT流处理中窗口聚合和CEP复杂事件处理如何实现？')}">
    <rect x="60" y="203" width="150" height="30" rx="6" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="0.5"/>
    <text class="chip" x="135" y="222" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)">窗口聚合 / CEP</text>
  </g>
  <g role="button" tabindex="0" aria-label="质量校验与过滤" onclick="sendPrompt('IoT流数据的实时质量校验和异常过滤策略如何设计？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT流数据的实时质量校验和异常过滤策略如何设计？')}">
    <rect x="230" y="203" width="150" height="30" rx="6" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="0.5"/>
    <text class="chip" x="305" y="222" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)">质量校验 / 过滤</text>
  </g>
  <g role="button" tabindex="0" aria-label="去重与迟到处理" onclick="sendPrompt('IoT实时流中如何做数据去重、乱序和迟到数据处理？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT实时流中如何做数据去重、乱序和迟到数据处理？')}">
    <rect x="400" y="203" width="150" height="30" rx="6" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="0.5"/>
    <text class="chip" x="475" y="222" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)">去重 / 迟到处理</text>
  </g>

  <path class="flow" d="M340 233 L340 258" fill="none"/>

  <rect x="40" y="260" width="600" height="200" rx="12" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="286" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)">存储层（三分区架构）</text>
  <g role="button" tabindex="0" aria-label="Bronze区" onclick="sendPrompt('数据湖Bronze区原始数据存储格式、分区和生命周期策略如何设计？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('数据湖Bronze区原始数据存储格式、分区和生命周期策略如何设计？')}">
    <rect x="60" y="300" width="168" height="140" rx="8" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
    <text class="zone-title" x="144" y="325" text-anchor="middle" dominant-baseline="central" fill="rgb(245,196,179)">Bronze 区</text>
    <text class="zone-line" x="144" y="345" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)">原始 / 不可变</text>
    <text class="zone-line" x="144" y="363" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)">Parquet · Avro</text>
    <text class="zone-line" x="144" y="381" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)">全量保留 3-7年</text>
    <text class="zone-line" x="144" y="399" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)">冷存储 / 对象存储</text>
    <text class="zone-line" x="144" y="417" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)">按设备 / 日期分区</text>
  </g>
  <g role="button" tabindex="0" aria-label="Silver区" onclick="sendPrompt('数据湖Silver区清洗、标准化和ACID表格式如何设计？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('数据湖Silver区清洗、标准化和ACID表格式如何设计？')}">
    <rect x="256" y="300" width="168" height="140" rx="8" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="0.5"/>
    <text class="zone-title" x="340" y="325" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)">Silver 区</text>
    <text class="zone-line" x="340" y="345" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)">清洗 / 标准化</text>
    <text class="zone-line" x="340" y="363" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)">Delta Lake · Iceberg</text>
    <text class="zone-line" x="340" y="381" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)">保留 1-3年</text>
    <text class="zone-line" x="340" y="399" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)">支持 ACID 事务</text>
    <text class="zone-line" x="340" y="417" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)">时间旅行查询</text>
  </g>
  <g role="button" tabindex="0" aria-label="Gold区" onclick="sendPrompt('数据湖Gold区聚合指标、物化视图和低延迟查询如何设计？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('数据湖Gold区聚合指标、物化视图和低延迟查询如何设计？')}">
    <rect x="452" y="300" width="168" height="140" rx="8" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
    <text class="zone-title" x="536" y="325" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)">Gold 区</text>
    <text class="zone-line" x="536" y="345" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">聚合 / 业务指标</text>
    <text class="zone-line" x="536" y="363" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">列式 / 压缩</text>
    <text class="zone-line" x="536" y="381" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">保留 90天滚动</text>
    <text class="zone-line" x="536" y="399" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">物化视图</text>
    <text class="zone-line" x="536" y="417" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">低延迟查询</text>
  </g>

  <path class="flow" d="M340 460 L340 488" fill="none"/>

  <rect x="40" y="490" width="600" height="72" rx="12" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="518" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)">服务层</text>
  <text class="layer-sub" x="340" y="538" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)">统一查询 · 数据目录 · 访问控制 · 血缘追踪</text>
  <g role="button" tabindex="0" aria-label="统一查询引擎" onclick="sendPrompt('IoT数据湖统一查询引擎如何选型：Trino、Spark SQL还是云数仓？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT数据湖统一查询引擎如何选型：Trino、Spark SQL还是云数仓？')}">
    <rect x="60" y="548" width="140" height="30" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
    <text class="chip" x="130" y="567" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)">Trino / Spark SQL</text>
  </g>
  <g role="button" tabindex="0" aria-label="数据目录与血缘" onclick="sendPrompt('IoT数据湖数据目录、元数据管理和血缘追踪如何实现？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT数据湖数据目录、元数据管理和血缘追踪如何实现？')}">
    <rect x="220" y="548" width="140" height="30" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
    <text class="chip" x="290" y="567" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)">数据目录 / 血缘</text>
  </g>
  <g role="button" tabindex="0" aria-label="行列级权限控制" onclick="sendPrompt('IoT数据湖行列级权限和细粒度访问控制如何设计？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT数据湖行列级权限和细粒度访问控制如何设计？')}">
    <rect x="380" y="548" width="140" height="30" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
    <text class="chip" x="450" y="567" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)">行列级权限控制</text>
  </g>

  <path class="flow" d="M340 578 L340 606" fill="none"/>

  <rect x="40" y="608" width="600" height="48" rx="12" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
  <text class="layer-title" x="340" y="636" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)">消费层</text>
  <g role="button" tabindex="0" aria-label="AI与机器学习" onclick="sendPrompt('IoT数据湖如何对接AI/ML训练平台？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT数据湖如何对接AI/ML训练平台？')}">
    <rect x="60" y="622" width="100" height="24" rx="5" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
    <text class="chip" x="110" y="638" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)">AI / ML</text>
  </g>
  <g role="button" tabindex="0" aria-label="BI报表" onclick="sendPrompt('IoT数据湖BI报表接入的最佳实践是什么？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT数据湖BI报表接入的最佳实践是什么？')}">
    <rect x="178" y="622" width="100" height="24" rx="5" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
    <text class="chip" x="228" y="638" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)">BI 报表</text>
  </g>
  <g role="button" tabindex="0" aria-label="数字孪生" onclick="sendPrompt('IoT数字孪生如何消费数据湖数据？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT数字孪生如何消费数据湖数据？')}">
    <rect x="296" y="622" width="100" height="24" rx="5" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
    <text class="chip" x="346" y="638" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)">数字孪生</text>
  </g>
  <g role="button" tabindex="0" aria-label="实时监控" onclick="sendPrompt('IoT平台实时监控大屏如何对接数据湖？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT平台实时监控大屏如何对接数据湖？')}">
    <rect x="414" y="622" width="100" height="24" rx="5" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
    <text class="chip" x="464" y="638" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)">实时监控</text>
  </g>
  <g role="button" tabindex="0" aria-label="开放API" onclick="sendPrompt('IoT数据湖开放API设计规范是什么？')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('IoT数据湖开放API设计规范是什么？')}">
    <rect x="532" y="622" width="88" height="24" rx="5" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
    <text class="chip" x="576" y="638" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)">开放 API</text>
  </g>

  <text class="foot" x="340" y="670" text-anchor="middle">点击任一模块继续追问该层的设计细节</text>
</svg>
