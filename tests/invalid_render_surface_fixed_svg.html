<h2 class="sr-only">Walkthrough fixture with non-scalable embedded SVG</h2>
<style>
.fl-step { display:none; }
.fl-step.active { display:block; }
.fl-step { overflow-wrap:anywhere; }
.dot { width:10px;height:10px;border-radius:50%;display:inline-block; }
@media (prefers-reduced-motion: no-preference) {
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @keyframes travel { from{stroke-dashoffset:120} to{stroke-dashoffset:0} }
  .anim-pulse { animation: pulse 1.2s ease-in-out infinite; }
  .anim-travel { stroke-dasharray:8 4; animation: travel .8s linear infinite; }
}
</style>
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
<div id="dots" style="display:flex;gap:8px"></div>
<button id="btn-prev" onclick="move(-1)" style="min-height:32px;padding:6px 16px" aria-label="Previous">Prev</button>
<button id="btn-next" onclick="move(1)" style="min-height:32px;padding:6px 16px" aria-label="Next">Next</button>
</div>
<div id="step-label"></div>
<div class="fl-step active">
<svg width="680" viewBox="0 0 680 240" role="img" xmlns="http://www.w3.org/2000/svg"><title>Step one</title><desc>Fixed width SVG should fail render surface validation.</desc><rect x="40" y="40" width="600" height="80" rx="8"/><text x="340" y="84" text-anchor="middle">Fixed width</text></svg>
</div>
<div class="fl-step">
<svg width="680" viewBox="0 0 680 240" role="img" xmlns="http://www.w3.org/2000/svg"><title>Step two</title><desc>Fixed width SVG should fail render surface validation.</desc><rect x="40" y="40" width="600" height="80" rx="8"/><text x="340" y="84" text-anchor="middle">Fixed width</text></svg>
</div>
<div data-controller="var labels = ['1 / 2', '2 / 2']; var total = 2; function render() { disabled = false; } function move() {}"></div>
