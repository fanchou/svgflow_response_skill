<svg width="100%" viewBox="0 0 680 260" role="img" lang="en" dir="ltr" xmlns="http://www.w3.org/2000/svg">
<title>Invalid script prompt</title>
<desc>Prompt interaction is detached from visible controls.</desc>
<defs></defs>
<rect x="80" y="60" width="220" height="88" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/>
<text x="190" y="104" text-anchor="middle" dominant-baseline="central" fill="rgb(245, 196, 179)" font-size="14">Detached</text>
<script>sendPrompt('Detached prompt call.')</script>
</svg>
