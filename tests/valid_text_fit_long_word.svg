<svg width="100%" viewBox="0 0 680 240" role="img" lang="en" dir="ltr" xmlns="http://www.w3.org/2000/svg">
<title>Text fit with long technical token</title>
<desc>Long identifiers use explicit fitting metadata instead of overflowing their container.</desc>
<defs></defs>
<rect x="40" y="40" width="600" height="120" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
<text x="340" y="82" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(206, 203, 246)">Stable API Gateway</text>
<text x="340" y="112" text-anchor="middle" dominant-baseline="central" font-size="12" data-fit="shrink" textLength="420" lengthAdjust="spacingAndGlyphs" fill="rgb(175, 169, 236)">CustomerIdentityResolutionPipeline</text>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(175, 169, 236)">Explicit fit keeps the label inside the card.</text>
</svg>
