<svg width="100%" viewBox="0 0 680 240" role="img" lang="en" dir="ltr" xmlns="http://www.w3.org/2000/svg">
<title>Invalid negative spacing</title>
<desc>Negative letter spacing makes multilingual text brittle.</desc>
<defs></defs>
<rect x="40" y="40" width="360" height="80" rx="8" fill="rgb(8, 80, 65)" stroke="rgb(93, 202, 165)" stroke-width="0.5"/>
<text x="220" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" letter-spacing="-0.5" fill="rgb(159, 225, 203)">Compressed label</text>
</svg>
