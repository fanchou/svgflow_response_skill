<svg width="100%" viewBox="0 0 680 260" role="img" lang="en" dir="ltr" xmlns="http://www.w3.org/2000/svg">
<title>Unsafe interaction prompt fixture</title>
<desc>Clickable SVG module has accessible controls but an unescaped prompt quote in inline JavaScript.</desc>
<defs></defs>
<g role="button" tabindex="0" aria-label="Explain Bob's plan" onclick="sendPrompt('Explain Bob's plan.')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Explain Bob's plan.')}">
<rect x="80" y="60" width="220" height="88" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/>
<text x="190" y="96" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14" font-weight="500">Unsafe prompt</text>
<text x="190" y="120" text-anchor="middle" dominant-baseline="central" fill="rgb(175, 169, 236)" font-size="12">Quote is not JavaScript escaped</text>
</g>
</svg>
