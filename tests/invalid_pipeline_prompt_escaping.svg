<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Experiment Priority Matrix</title>
<desc>A universal fallback infographic for prioritizing experiments by impact and effort without adding a new diagram family.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<mask id="experiment-label-gaps" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="520" fill="white"/><rect x="300" y="246" width="80" height="22" fill="black" rx="3"/><rect x="165" y="276" width="86" height="22" fill="black" rx="3"/><rect x="428" y="276" width="76" height="22" fill="black" rx="3"/></mask>
</defs>
<rect x="40" y="70" width="600" height="320" rx="12" fill="none" stroke="rgb(133, 183, 235)" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="56" y="94" fill="rgb(194, 192, 182)" font-size="12" font-weight="500">Impact vs effort</text>
<path d="M120 350 L120 110" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M96 330 L594 330" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="76" y="118" fill="rgb(194, 192, 182)" font-size="12">Impact</text>
<text x="548" y="354" fill="rgb(194, 192, 182)" font-size="12">Effort</text>
<g role="button" tabindex="0" aria-label="Which Bob's experiments should ship first?" onclick="sendPrompt('Which Bob's experiments should ship first?')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('Which Bob's experiments should ship first?')}"><rect x="145" y="116" width="190" height="96" rx="8" fill="rgb(39, 80, 10)" stroke="rgb(151, 196, 89)" stroke-width="0.5"/><text x="240" y="142" text-anchor="middle" dominant-baseline="central" fill="rgb(192, 221, 151)" font-size="14" font-weight="500">Quick wins</text><text x="240" y="164" text-anchor="middle" dominant-baseline="central" fill="rgb(151, 196, 89)" font-size="12">High impact, low effort</text><text x="240" y="188" text-anchor="middle" dominant-baseline="central" fill="rgb(151, 196, 89)" font-size="12">Reminder + checklist</text></g>
<g><rect x="365" y="116" width="190" height="96" rx="8" fill="rgb(60, 52, 137)" stroke="rgb(175, 169, 236)" stroke-width="0.5"/><text x="460" y="142" text-anchor="middle" dominant-baseline="central" fill="rgb(206, 203, 246)" font-size="14" font-weight="500">Strategic bets</text><text x="460" y="164" text-anchor="middle" dominant-baseline="central" fill="rgb(175, 169, 236)" font-size="12">High impact, high effort</text><text x="460" y="188" text-anchor="middle" dominant-baseline="central" fill="rgb(175, 169, 236)" font-size="12">Workspace + insights</text></g>
<g><rect x="145" y="250" width="190" height="82" rx="8" fill="rgb(12, 68, 124)" stroke="rgb(133, 183, 235)" stroke-width="0.5"/><text x="240" y="276" text-anchor="middle" dominant-baseline="central" fill="rgb(181, 212, 244)" font-size="14" font-weight="500">Fill-ins</text><text x="240" y="298" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 183, 235)" font-size="12">Low impact, low effort</text></g>
<g><rect x="365" y="250" width="190" height="82" rx="8" fill="rgb(99, 56, 6)" stroke="rgb(239, 159, 39)" stroke-width="0.5"/><text x="460" y="276" text-anchor="middle" dominant-baseline="central" fill="rgb(250, 199, 117)" font-size="14" font-weight="500">Defer</text><text x="460" y="298" text-anchor="middle" dominant-baseline="central" fill="rgb(239, 159, 39)" font-size="12">Low impact, high effort</text></g>
<g role="button" tabindex="0" aria-label="How should strategic bets be sequenced after quick wins?" onclick="sendPrompt('How should strategic bets be sequenced after quick wins?')" onkeydown="if(event.key==='Enter'||event.key===' '){sendPrompt('How should strategic bets be sequenced after quick wins?')}"><rect x="220" y="408" width="240" height="54" rx="8" fill="rgb(113, 43, 19)" stroke="rgb(240, 153, 123)" stroke-width="0.5"/><text x="340" y="429" text-anchor="middle" dominant-baseline="central" fill="rgb(245, 196, 179)" font-size="14" font-weight="500">Recommended move</text><text x="340" y="448" text-anchor="middle" dominant-baseline="central" fill="rgb(240, 153, 123)" font-size="12">Ship quick wins first</text></g>
<path d="M240 212 L300 246 L340 406" fill="none" stroke="rgb(151, 196, 89)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#experiment-label-gaps)"/>
<path d="M460 212 L380 246 L350 406" fill="none" stroke="rgb(175, 169, 236)" stroke-width="1.5" marker-end="url(#arrow)" mask="url(#experiment-label-gaps)"/>
<path d="M335 290 L363 290" fill="none" stroke="rgb(156, 154, 146)" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)" mask="url(#experiment-label-gaps)"/>
<path d="M240 250 L240 214" fill="none" stroke="rgb(133, 183, 235)" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)" mask="url(#experiment-label-gaps)"/>
<rect x="300" y="246" width="80" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="340" y="260" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Prioritize</text>
<rect x="165" y="276" width="86" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="208" y="290" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Bundle</text>
<rect x="428" y="276" width="76" height="22" rx="5" fill="rgb(38, 38, 36)" stroke="rgba(222, 220, 209, 0.3)" stroke-width="0.5"/><text x="466" y="290" text-anchor="middle" dominant-baseline="central" fill="rgb(194, 192, 182)" font-size="12">Revisit</text>
<rect x="156" y="484" width="12" height="12" rx="2" fill="rgb(151, 196, 89)"/><text x="174" y="494" fill="rgb(194, 192, 182)" font-size="12">Ship now</text>
<rect x="286" y="484" width="12" height="12" rx="2" fill="rgb(175, 169, 236)"/><text x="304" y="494" fill="rgb(194, 192, 182)" font-size="12">Plan next</text>
<rect x="418" y="484" width="12" height="12" rx="2" fill="rgb(239, 159, 39)"/><text x="436" y="494" fill="rgb(194, 192, 182)" font-size="12">Delay</text>
</svg>
